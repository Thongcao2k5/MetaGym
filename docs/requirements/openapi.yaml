openapi: 3.0.3
info:
  title: Meta Gym REST API
  version: 1.0.0
  description: |
    Tài liệu OpenAPI 3.0 (Swagger) cho hệ thống **Meta Gym**, đối chiếu trực tiếp từ schema PostgreSQL (`database/migrations/0001`–`0024`) và các route Express trong `backend/src/routes/`.

    ### Quy ước chung
    - **Base URL:** `/api/v1`
    - **Xác thực:** JWT Bearer Token (`Authorization: Bearer <accessToken>`), hết hạn sau `3600` giây.
    - **Vai trò (RBAC):** `MEMBER`, `COACH`, `ADMIN`.
    - **Định dạng dữ liệu:** JSON key dùng `camelCase`, enum dùng `UPPER_SNAKE_CASE`, ngày dùng `YYYY-MM-DD`, timestamp dùng ISO 8601.
    - **Envelope phản hồi:**
      - Đơn lẻ: `{ "data": { ... } }`
      - Danh sách phân trang: `{ "data": [ ... ], "pagination": { "page": 1, "pageSize": 20, "totalItems": 0, "totalPages": 0 } }`
      - Lỗi: `{ "error": { "code": "...", "message": "...", "details": {} } }`

servers:
  - url: /api/v1
    description: Current Server (Same Origin — Local / Render)
  - url: http://localhost:3000/api/v1
    description: Local Development
  - url: https://your-backend.onrender.com/api/v1
    description: Cloud Production (Render)

security:
  - bearerAuth: []

tags:
  - name: System
    description: Kiểm tra trạng thái backend & PostgreSQL
  - name: Auth & Password Reset
    description: Đăng ký, đăng nhập và khôi phục mật khẩu (`users`, `password_reset_codes`)
  - name: Users & Profile
    description: Hồ sơ cá nhân, khai báo sức khỏe, avatar (`users`, `member_profiles`, `coach_profiles`)
  - name: Admin Users & Dashboard
    description: Quản lý tài khoản và thống kê tổng quan (`users`, `admin_audit_logs`)
  - name: Membership & Payments
    description: Gói hội viên, thanh toán online/tại quầy (`membership_plans`, `payments`, `member_memberships`)
  - name: Coaching, Packages & Bookings
    description: Gói coach, giữ chỗ, lịch tuần, đặt lịch, yêu cầu kết nối/chấm dứt/chuyển coach (`coach_package_plans`, `coach_payment_holds`, `coach_weekly_slots`, `coach_entitlements`, `coach_bookings`, `coach_slot_blocks`, `coach_notifications`, `coach_requests`, `coach_relationships`, `coach_termination_requests`, `coach_transfer_history`)
  - name: Coach Outcomes
    description: Kết quả huấn luyện before/after của Coach (`coach_outcome_cases`)
  - name: Catalog & Gym Check-in
    description: Thông tin phòng gym, thiết bị, bài tập, mã QR check-in (`gym_profile`, `equipment`, `exercises`, `gym_checkin_code`, `gym_visits`)
  - name: Training & Self-Training
    description: Giáo án tập luyện, buổi tập, ngày tự tập (`training_plans`, `training_plan_days`, `training_plan_exercises`, `training_sessions`, `member_self_training_days`)
  - name: Nutrition
    description: Hướng dẫn dinh dưỡng, thực phẩm chuẩn, thực đơn và nhật ký dinh dưỡng (`nutrition_guides`, `nutrition_guide_revisions`, `nutrition_foods`, `training_plan_day_meals`, `member_nutrition_days`)
  - name: Progress & Journal
    description: Theo dõi buổi tập, chỉ số cơ thể, ảnh tiến độ, bình luận và nhật ký (`workout_logs`, `workout_log_exercises`, `meal_logs`, `body_measurements`, `progress_photos`, `progress_comments`, `member_journal_entries`, `member_journal_photos`)
  - name: Messaging & Realtime
    description: Hội thoại trực tiếp Member–Coach (`conversations`, `conversation_participants`, `messages`)
  - name: Calls
    description: Cuộc gọi thoại/video qua LiveKit (`call_logs`)
  - name: AI Assistant
    description: Trợ lý AI hội thoại (`ai_conversations`, `ai_messages`)
  - name: Media
    description: Tải lên và cấp quyền truy cập ảnh (`media_assets`)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Khóa chống tạo giao dịch trùng khi client retry
      schema:
        type: string

  responses:
    Unauthorized:
      description: Thiếu token hoặc token hết hạn/vô hiệu (`UNAUTHORIZED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không có quyền truy cập hoặc chưa có gói tập (`FORBIDDEN` / `MEMBERSHIP_REQUIRED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy tài nguyên (`NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Dữ liệu đầu vào không hợp lệ (`VALIDATION_ERROR`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Provider ngoài chưa được cấu hình (`SERVICE_UNAVAILABLE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Dữ liệu không hợp lệ
            details:
              type: object
              additionalProperties: true

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalItems:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 3

    User:
      type: object
      description: Bảng `users` + profile mở rộng (`member_profiles` / `coach_profiles`)
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum: [MEMBER, COACH, ADMIN]
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]
        phone:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        healthDeclaration:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MembershipPlan:
      type: object
      description: Bảng `membership_plans`
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        durationDays:
          type: integer
        priceVnd:
          type: integer
        isActive:
          type: boolean

    Payment:
      type: object
      description: Bảng `payments`
      properties:
        id:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        amountVnd:
          type: integer
        method:
          type: string
          enum: [ONLINE_MOCK, CASH, BANK_TRANSFER, CARD]
        status:
          type: string
          enum: [PENDING, PAID, FAILED, CANCELLED]
        idempotencyKey:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    CoachPackagePlan:
      type: object
      description: Bảng `coach_package_plans`
      properties:
        code:
          type: string
        name:
          type: string
        sessionsCount:
          type: integer
        durationDays:
          type: integer
        priceVnd:
          type: integer
        isActive:
          type: boolean

    CoachBooking:
      type: object
      description: Bảng `coach_bookings`
      properties:
        id:
          type: string
          format: uuid
        relationshipId:
          type: string
          format: uuid
        coachId:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        slotDate:
          type: string
          format: date
        startTime:
          type: string
          example: '08:00'
        endTime:
          type: string
          example: '09:00'
        status:
          type: string
          enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED, REJECTED]

    TrainingPlan:
      type: object
      description: Bảng `training_plans` + `training_plan_days` + `training_plan_exercises`
      properties:
        id:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        coachId:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        days:
          type: array
          items:
            type: object
            properties:
              dayIndex:
                type: integer
              title:
                type: string
              exercises:
                type: array
                items:
                  type: object

    NutritionFood:
      type: object
      description: Bảng `nutrition_foods`
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        caloriesPer100g:
          type: number
        proteinPer100g:
          type: number
        carbsPer100g:
          type: number
        fatPer100g:
          type: number
        isActive:
          type: boolean

    MemberNutritionDay:
      type: object
      description: Bảng `member_nutrition_days`
      properties:
        date:
          type: string
          format: date
        targetCalories:
          type: number
        consumedCalories:
          type: number
        entries:
          type: array
          items:
            type: object

    GymVisit:
      type: object
      description: Bảng `gym_visits`
      properties:
        id:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        checkedInAt:
          type: string
          format: date-time

    MediaAsset:
      type: object
      description: Bảng `media_assets`
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        mimeType:
          type: string
          enum: [image/jpeg, image/png]
        sizeBytes:
          type: integer
        createdAt:
          type: string
          format: date-time

paths:
  /health:
    get:
      tags: [System]
      summary: Kiểm tra tình trạng API và PostgreSQL
      security: []
      responses:
        '200':
          description: Hệ thống sẵn sàng

  /auth/registrations:
    post:
      tags: [Auth & Password Reset]
      summary: Đăng ký tài khoản Member mới
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, password]
              properties:
                fullName:
                  type: string
                  minLength: 2
                  maxLength: 120
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
      responses:
        '201':
          description: Tạo tài khoản Member thành công
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/sessions:
    post:
      tags: [Auth & Password Reset]
      summary: Đăng nhập (Member / Coach / Admin)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Trả về accessToken JWT và thông tin user
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Vượt quá giới hạn đăng nhập (`auth_login_rate_limits`)

  /password-reset-requests:
    post:
      tags: [Auth & Password Reset]
      summary: Yêu cầu gửi mã đặt lại mật khẩu qua email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Đã tiếp nhận yêu cầu
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /password-reset-verifications:
    post:
      tags: [Auth & Password Reset]
      summary: Xác minh mã đặt lại mật khẩu
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: Mã hợp lệ

  /password-resets:
    post:
      tags: [Auth & Password Reset]
      summary: Đặt mật khẩu mới sau khi xác minh mã
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, newPassword]
              properties:
                email:
                  type: string
                code:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Đổi mật khẩu thành công

  /users/me:
    get:
      tags: [Users & Profile]
      summary: Lấy thông tin người dùng hiện tại
      responses:
        '200':
          description: Hồ sơ user hiện tại
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
    patch:
      tags: [Users & Profile]
      summary: Cập nhật hồ sơ cá nhân
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Cập nhật thành công

  /users/me/health-declaration:
    patch:
      tags: [Users & Profile]
      summary: Cập nhật khai báo sức khỏe của Member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Cập nhật khai báo sức khỏe thành công

  /users/me/password:
    patch:
      tags: [Users & Profile]
      summary: Đổi mật khẩu (vô hiệu hóa các JWT cũ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Đổi mật khẩu thành công

  /users/me/avatar:
    post:
      tags: [Users & Profile]
      summary: Tải lên ảnh đại diện (PNG/JPEG, xử lý qua Sharp)
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Cập nhật avatar thành công
    delete:
      tags: [Users & Profile]
      summary: Xóa ảnh đại diện hiện tại
      responses:
        '200':
          description: Đã xóa avatar

  /users/{id}/avatar:
    get:
      tags: [Users & Profile]
      summary: Lấy ảnh đại diện của user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dữ liệu ảnh avatar

  /admin/users:
    get:
      tags: [Admin Users & Dashboard]
      summary: Danh sách Member/Coach (Admin)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: role
          in: query
          schema:
            type: string
            enum: [MEMBER, COACH]
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Danh sách tài khoản

  /admin/users/{userId}:
    get:
      tags: [Admin Users & Dashboard]
      summary: Chi tiết tài khoản (Admin)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chi tiết user
    patch:
      tags: [Admin Users & Dashboard]
      summary: Cập nhật thông tin user hoặc giới hạn học viên của Coach (Admin)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Cập nhật thành công

  /admin/users/{userId}/status:
    patch:
      tags: [Admin Users & Dashboard]
      summary: Khóa hoặc mở khóa tài khoản (Admin)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, SUSPENDED]
      responses:
        '200':
          description: Đã cập nhật trạng thái

  /admin/coaches:
    post:
      tags: [Admin Users & Dashboard]
      summary: Tạo tài khoản Coach mới (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, password]
              properties:
                fullName:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '201':
          description: Tạo Coach thành công

  /admin/coaches/{coachId}/password-resets:
    post:
      tags: [Admin Users & Dashboard]
      summary: Đặt mật khẩu tạm thời cho Coach (Admin)
      parameters:
        - name: coachId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Đã đặt lại mật khẩu tạm thời

  /admin/dashboard:
    get:
      tags: [Admin Users & Dashboard]
      summary: Số liệu thống kê tổng quan cho Admin Web
      responses:
        '200':
          description: Dữ liệu KPI và biểu đồ

  /membership-plans:
    get:
      tags: [Membership & Payments]
      summary: Danh sách gói hội viên đang mở bán
      responses:
        '200':
          description: Danh sách gói tập

  /membership-plans/{planId}:
    get:
      tags: [Membership & Payments]
      summary: Chi tiết gói hội viên
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chi tiết gói tập

  /membership-plans/{planId}/quote:
    get:
      tags: [Membership & Payments]
      summary: Báo giá và thời hạn dự kiến khi mua/gia hạn gói
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thông tin báo giá

  /payments:
    post:
      tags: [Membership & Payments]
      summary: Tạo giao dịch thanh toán gói hội viên (Member)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Giao dịch được tạo

  /payments/me:
    get:
      tags: [Membership & Payments]
      summary: Lịch sử thanh toán của Member hiện tại
      responses:
        '200':
          description: Danh sách giao dịch

  /payments/{paymentId}:
    get:
      tags: [Membership & Payments]
      summary: Chi tiết giao dịch thanh toán
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chi tiết giao dịch

  /payments/{paymentId}/mock-confirmations:
    post:
      tags: [Membership & Payments]
      summary: Xác nhận thanh toán giả lập (development/demo)
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Kích hoạt membership tương ứng

  /payments/{paymentId}/cancellations:
    post:
      tags: [Membership & Payments]
      summary: Hủy giao dịch đang chờ
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Đã hủy giao dịch

  /memberships/me:
    get:
      tags: [Membership & Payments]
      summary: Gói hội viên đang hiệu lực của Member
      responses:
        '200':
          description: Thông tin membership hiện tại

  /memberships/me/history:
    get:
      tags: [Membership & Payments]
      summary: Lịch sử gói hội viên của Member
      responses:
        '200':
          description: Danh sách lịch sử gói tập

  /admin/membership-plans:
    get:
      tags: [Membership & Payments]
      summary: Danh sách tất cả gói hội viên (Admin)
      responses:
        '200':
          description: Danh sách gói tập
    post:
      tags: [Membership & Payments]
      summary: Tạo gói hội viên mới (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipPlan'
