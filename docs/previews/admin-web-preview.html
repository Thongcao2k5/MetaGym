<!doctype html>
<html lang="vi" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meta Gym Admin — Interactive Redesign Preview (Checkpoint 1)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --meta-bg: #0F1115;
      --meta-surface: #181B22;
      --meta-raised: #1F232C;
      --meta-border: #262A34;
      --meta-border-strong: #323846;
      --meta-text: #F7F9FC;
      --meta-text-strong: #FFFFFF;
      --meta-text-secondary: #8E95A5;
      --meta-primary: #FF5E36;
      --meta-primary-hover: #E84E27;
      --meta-on-primary: #FFFFFF;
      --meta-reflection: #A9C7E8;
      --meta-success: #2ECC71;
      --meta-on-success: #06261D;
      --meta-warning: #F39C12;
      --meta-on-warning: #2A1900;
      --meta-danger: #F15B64;
      --meta-danger-text: #FF7C84;
      --meta-on-danger: #2C080B;
      --meta-info: #70AEE8;
      --meta-on-info: #071A2C;
      --meta-focus: #8DBCF0;
      --meta-coach-avatar: #F5B041;
      --meta-on-coach-avatar: #181B22;
      --meta-scrim: rgba(4, 6, 9, 0.72);

      --r-xs: 6px;
      --r-sm: 10px;
      --r-md: 14px;
      --r-lg: 20px;
      --r-xl: 24px;
      --r-full: 999px;

      --font-sans: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --sidebar-w: 264px;
      --preview-bar-h: 56px;
      --t-fast: 120ms ease-out;
      --t-med: 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--meta-bg);
      color: var(--meta-text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: clip;
    }

    a { color: var(--meta-info); text-decoration: none; }
    a:hover { text-decoration: underline; }

    button, input, select, textarea {
      font-family: inherit;
      font-size: 14px;
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--meta-focus);
      outline-offset: 2px;
      box-shadow: 0 0 0 4px rgba(141, 188, 240, 0.22);
    }

    .tabular { font-variant-numeric: tabular-nums; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .skip-link {
      position: fixed; left: 12px; top: -80px; z-index: 2000;
      background: var(--meta-primary); color: var(--meta-on-primary);
      padding: 12px 16px; border-radius: var(--r-md); font-weight: 600;
      min-height: 44px; display: inline-flex; align-items: center;
    }
    .skip-link:focus { top: 12px; }

    /* =====================================================================
       TOP PREVIEW STATE SWITCHER BAR (Solid Graphite, zero blur)
       ===================================================================== */
    .preview-bar {
      position: sticky;
      top: 0;
      z-index: 900;
      background: #14171E;
      border-bottom: 1px solid var(--meta-border);
      padding: 6px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .preview-bar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .preview-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--meta-reflection);
      background: var(--meta-raised);
      border: 1px solid var(--meta-border-strong);
      border-radius: var(--r-sm);
      padding: 6px 10px;
      white-space: nowrap;
    }
    .preview-dot {
      width: 8px; height: 8px; border-radius: 999px; background: var(--meta-primary);
    }
    .state-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .state-pill {
      min-height: 44px;
      padding: 0 12px;
      border-radius: var(--r-sm);
      border: 1px solid var(--meta-border);
      background: var(--meta-surface);
      color: var(--meta-text-secondary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast);
      white-space: nowrap;
    }
    .state-pill:hover {
      background: var(--meta-raised);
      color: var(--meta-text-strong);
      border-color: var(--meta-border-strong);
    }
    .state-pill[aria-pressed="true"] {
      background: rgba(255, 94, 54, 0.14);
      border-color: var(--meta-primary);
      color: var(--meta-text-strong);
    }
    .preview-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .preview-select {
      min-height: 44px;
      background: var(--meta-surface);
      border: 1px solid var(--meta-border);
      border-radius: var(--r-sm);
      padding: 0 12px;
      color: var(--meta-text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* =====================================================================
       APP SHELL (Operate Mode — Solid Graphite)
       ===================================================================== */
    .app-shell {
      display: flex;
      min-height: calc(100vh - var(--preview-bar-h));
      background: var(--meta-bg);
    }

    .sidebar {
      width: var(--sidebar-w);
      flex: 0 0 var(--sidebar-w);
      background: var(--meta-surface);
      border-right: 1px solid var(--meta-border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: var(--preview-bar-h);
      height: calc(100vh - var(--preview-bar-h));
      overflow-y: auto;
      z-index: 500;
    }
    .sidebar-head {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--meta-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--meta-text-strong);
      text-decoration: none;
    }
    .brand:hover { text-decoration: none; }
    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: var(--r-sm);
      background: var(--meta-primary);
      color: var(--meta-on-primary);
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.02em;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.15;
    }
    .brand-sub {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--meta-text-secondary);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .sidebar-close {
      display: none;
    }

    .sidebar-nav {
      padding: 12px 12px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .nav-group-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--meta-text-secondary);
      padding: 0 12px 6px;
    }
    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .nav-item {
      width: 100%;
      min-height: 44px;
      padding: 8px 12px;
      border-radius: var(--r-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--meta-text-secondary);
      font-weight: 500;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      position: relative;
      transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
    }
    .nav-item:hover {
      background: var(--meta-raised);
      color: var(--meta-text-strong);
    }
    .nav-item[aria-current="page"] {
      background: var(--meta-raised);
      border-color: var(--meta-border-strong);
      color: var(--meta-text-strong);
      font-weight: 600;
    }
    .nav-item[aria-current="page"]::before {
      content: "";
      position: absolute;
      left: -1px;
      top: 8px;
      bottom: 8px;
      width: 3px;
      border-radius: 0 4px 4px 0;
      background: var(--meta-primary);
    }
    .nav-item[aria-current="page"] svg { color: var(--meta-primary); }
    .nav-item-label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .nav-count {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: var(--r-full);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .nav-count.warn { background: rgba(243, 156, 18, 0.14); color: var(--meta-warning); border: 1px solid rgba(243, 156, 18, 0.4); }
    .nav-count.danger { background: rgba(241, 91, 100, 0.12); color: var(--meta-danger-text); border: 1px solid rgba(241, 91, 100, 0.42); }

    .sidebar-foot {
      padding: 12px;
      border-top: 1px solid var(--meta-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .admin-user-btn {
      width: 100%;
      min-height: 48px;
      padding: 8px 10px;
      border-radius: var(--r-sm);
      border: 1px solid var(--meta-border);
      background: var(--meta-raised);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      transition: border-color var(--t-fast);
    }
    .admin-user-btn:hover { border-color: var(--meta-border-strong); }
    .admin-user-meta { flex: 1; min-width: 0; }
    .admin-user-name {
      display: block; font-size: 13px; font-weight: 600; color: var(--meta-text-strong);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .admin-user-role {
      display: block; font-size: 11px; color: var(--meta-text-secondary);
    }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--meta-scrim);
      z-index: 480;
    }
    .sidebar-backdrop.open { display: block; }

    /* MAIN CONTENT */
    .main-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      padding: 16px 24px;
      border-bottom: 1px solid var(--meta-border);
      background: var(--meta-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .menu-toggle {
      display: none;
      min-width: 44px;
      min-height: 44px;
      border-radius: var(--r-sm);
      border: 1px solid var(--meta-border);
      background: var(--meta-surface);
      color: var(--meta-text);
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .page-heading {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.25;
      color: var(--meta-text-strong);
      letter-spacing: -0.01em;
    }
    .page-subtitle {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--meta-text-secondary);
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .page-content {
      padding: 24px;
      flex: 1;
      max-width: 1480px;
      width: 100%;
    }

    /* =====================================================================
       BUTTONS & CONTROLS (>= 44px hit target)
       ===================================================================== */
    .btn {
      min-height: 44px;
      min-width: 44px;
      padding: 0 16px;
      border-radius: var(--r-md);
      border: 1px solid var(--meta-border-strong);
      background: var(--meta-raised);
      color: var(--meta-text-strong);
      font-weight: 600;
      font-size: 13.5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-fast);
    }
    .btn:hover:not(:disabled) {
      background: #282D38;
      border-color: #3E4657;
    }
    .btn:active:not(:disabled) { transform: scale(0.985); }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--meta-primary);
      border-color: var(--meta-primary);
      color: var(--meta-on-primary);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--meta-primary-hover);
      border-color: var(--meta-primary-hover);
      color: var(--meta-on-primary);
    }

    .btn-ghost {
      background: transparent;
      border-color: var(--meta-border);
      color: var(--meta-text);
    }
    .btn-ghost:hover:not(:disabled) {
      background: var(--meta-raised);
      border-color: var(--meta-border-strong);
    }

    .btn-danger {
      background: rgba(241, 91, 100, 0.12);
      border-color: rgba(241, 91, 100, 0.5);
      color: var(--meta-danger-text);
    }
    .btn-danger:hover:not(:disabled) {
      background: rgba(241, 91, 100, 0.22);
      border-color: var(--meta-danger);
      color: #FFFFFF;
    }

    .btn-danger-solid {
      background: var(--meta-danger);
      border-color: var(--meta-danger);
      color: var(--meta-on-danger);
      font-weight: 700;
    }
    .btn-danger-solid:hover:not(:disabled) {
      background: #F4727A;
      border-color: #F4727A;
      color: var(--meta-on-danger);
    }

    .btn-success {
      background: rgba(46, 204, 113, 0.14);
      border-color: rgba(46, 204, 113, 0.45);
      color: var(--meta-success);
    }
    .btn-success:hover:not(:disabled) {
      background: rgba(46, 204, 113, 0.24);
      border-color: var(--meta-success);
      color: #FFFFFF;
    }

    .btn-warning {
      background: rgba(243, 156, 18, 0.14);
      border-color: rgba(243, 156, 18, 0.45);
      color: var(--meta-warning);
    }
    .btn-warning:hover:not(:disabled) {
      background: rgba(243, 156, 18, 0.24);
      border-color: var(--meta-warning);
      color: #FFFFFF;
    }

    .btn-sm {
      min-height: 44px;
      padding: 0 12px;
      font-size: 13px;
      border-radius: var(--r-sm);
    }
    .btn-icon {
      padding: 0;
      width: 44px;
      height: 44px;
      border-radius: var(--r-sm);
    }

    /* =====================================================================
       CARDS, GRIDS, BANNERS (Solid Graphite Level 1, NO BLUR)
       ===================================================================== */
    .card {
      background: var(--meta-surface);
      border: 1px solid var(--meta-border);
      border-radius: var(--r-lg);
      padding: 20px;
    }
    .card-compact { padding: 16px; }
    .card-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .card-title {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      color: var(--meta-text-strong);
      line-height: 1.35;
    }
    .card-sub {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--meta-text-secondary);
    }

    .stack-16 { display: flex; flex-direction: column; gap: 16px; }
    .stack-20 { display: flex; flex-direction: column; gap: 20px; }
    .stack-24 { display: flex; flex-direction: column; gap: 24px; }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .grid-split { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }

    /* KPI CARDS */
    .kpi-card {
      background: var(--meta-surface);
      border: 1px solid var(--meta-border);
      border-radius: var(--r-lg);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
      width: 100%;
      cursor: pointer;
      transition: border-color var(--t-fast), background var(--t-fast);
    }
    .kpi-card:hover {
      background: var(--meta-raised);
      border-color: var(--meta-border-strong);
    }
    .kpi-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .kpi-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--meta-text-secondary);
    }
    .kpi-icon {
      width: 34px; height: 34px;
      border-radius: var(--r-sm);
      background: var(--meta-raised);
      border: 1px solid var(--meta-border);
      display: grid; place-items: center;
      color: var(--meta-text-secondary);
      flex-shrink: 0;
    }
    .kpi-val {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.15;
      color: var(--meta-text-strong);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .kpi-meta {
      font-size: 12px;
      color: var(--meta-text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .kpi-link-hint {
      color: var(--meta-info);
      font-weight: 600;
      white-space: nowrap;
    }

    /* BANNERS */
    .banner {
      background: var(--meta-surface);
      border: 1px solid var(--meta-border);
      border-left-width: 4px;
      border-radius: var(--r-md);
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .banner-body {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      flex: 1;
      min-width: 240px;
    }
    .banner-icon { flex-shrink: 0; margin-top: 2px; }
    .banner-title { font-weight: 700; color: var(--meta-text-strong); margin: 0 0 2px; font-size: 14px; }
    .banner-text { margin: 0; color: var(--meta-text-secondary); font-size: 13px; }
    .banner-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .banner-info { border-left-color: var(--meta-info); background: rgba(112, 174, 232, 0.08); border-color: rgba(112, 174, 232, 0.28); border-left-width: 4px; }
    .banner-info .banner-icon { color: var(--meta-info); }
    .banner-warn { border-left-color: var(--meta-warning); background: rgba(243, 156, 18, 0.08); border-color: rgba(243, 156, 18, 0.30); border-left-width: 4px; }
    .banner-warn .banner-icon { color: var(--meta-warning); }
    .banner-danger { border-left-color: var(--meta-danger); background: rgba(241, 91, 100, 0.09); border-color: rgba(241, 91, 100, 0.34); border-left-width: 4px; }
    .banner-danger .banner-icon { color: var(--meta-danger); }
    .banner-success { border-left-color: var(--meta-success); background: rgba(46, 204, 113, 0.08); border-color: rgba(46, 204, 113, 0.30); border-left-width: 4px; }
    .banner-success .banner-icon { color: var(--meta-success); }

    /* =====================================================================
       BADGES, AVATARS, SEAT METERS (No orange flood on badges)
       ===================================================================== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--r-full);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .badge-dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; flex-shrink: 0; }
    .badge-success { background: rgba(46, 204, 113, 0.13); color: var(--meta-success); border-color: rgba(46, 204, 113, 0.35); }
    .badge-warning { background: rgba(243, 156, 18, 0.14); color: var(--meta-warning); border-color: rgba(243, 156, 18, 0.38); }
    .badge-danger  { background: rgba(241, 91, 100, 0.12); color: var(--meta-danger-text); border-color: rgba(241, 91, 100, 0.42); }
    .badge-info    { background: rgba(112, 174, 232, 0.13); color: var(--meta-info); border-color: rgba(112, 174, 232, 0.36); }
    .badge-neutral { background: rgba(142, 149, 165, 0.12); color: var(--meta-text-secondary); border-color: rgba(142, 149, 165, 0.30); }
    .badge-coral   { background: rgba(255, 94, 54, 0.12); color: #FF8768; border-color: rgba(255, 94, 54, 0.38); }

    .person-cell {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .avatar {
      width: 36px; height: 36px;
      border-radius: var(--r-full);
      background: var(--meta-raised);
      border: 1px solid var(--meta-border-strong);
      color: var(--meta-text-strong);
      font-size: 12px;
      font-weight: 700;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .avatar-coach {
      background: var(--meta-coach-avatar);
      color: var(--meta-on-coach-avatar);
      border-color: rgba(245, 176, 65, 0.65);
      font-weight: 800;
    }

    /* =====================================================================

    .chart-legend {

    /* IMPACT SUMMARY BOXES */
    .impact-box {
      background: var(--meta-bg);

    /* =====================================================================
       LOGIN VIEW (Standalone Centered Dark Graphite Card)

    .login-shell {

    .login-card {

    /* =====================================================================

    .qr-plate {
      background: #FFFFFF;

    /* =====================================================================
       STATES: SKELETON, EMPTY, TOAST

    .skel {

    .empty-state {

      border: 1px solid var(--meta-border);
      border-radius: var(--r-lg);

      flex-direction: column;

    .empty-icon {

    .toast-region {

       ===================================================================== */
    @media (max-width: 1199px) {

        REQUEST_REFUND: ['badge-coral', 'Chọn hoàn mô phỏng'],
        AWAITING_COUNTERPARTY: ['badge-info', 'Chờ đồng ý 72h'],
        MEMBER_LOCKED: ['badge-danger', 'Member bị khóa'],

        SIMULATED_REFUND: ['badge-danger', 'Hoàn mô phỏng'],
        VOID_REVERSAL: ['badge-danger', 'Đảo bút toán D6'],
        VOIDED: ['badge-neutral', 'Bản gốc đã đảo'],
        PAUSED_GYM_EXPIRED: ['badge-neutral', 'Tạm ngưng · Hết gói Gym'],
        GYM_EXPIRED: ['badge-neutral', 'Hết gói Gym'],
        EXPIRED: ['badge-neutral', 'Hết hạn'],
        ENDED: ['badge-neutral', 'Đã kết thúc'],
        INACTIVE: ['badge-neutral', 'Ngừng bán'],
        HIDDEN: ['badge-neutral', 'Đang ẩn'],
        NONE: ['badge-neutral', 'Chưa thuê Coach']
      };
      const [cls, label] = map[code] || ['badge-neutral', code];
      return `<span class="badge ${cls}"><span class="badge-dot"></span>${esc(label)}</span>`;
    }

    function relStatusBadge(rel) {
      if (rel.status === 'ACTIVE') return statusBadge('ACTIVE');
      if (rel.status === 'DISPUTED') return statusBadge('DISPUTED');
      if (rel.status === 'ENDED') return statusBadge('ENDED');
      if (rel.pauseReason === 'COACH_LOCKED') return statusBadge('PAUSED_COACH_LOCKED');
      if (rel.pauseReason === 'MEMBER_LOCKED') return statusBadge('PAUSED_MEMBER_LOCKED');
      return statusBadge('PAUSED_GYM_EXPIRED');
    }

    function seatMeterHtml(coach) {
      const total = coach.activeSeats + coach.heldSeats15m;
      const pct = Math.min(100, Math.round((total / coach.maxSeats) * 100));
      const cls = total >= 8 ? 'full' : total >= 6 ? 'near' : '';
      return `<div class="seat-meter">
        <div class="seat-meter-row">
          <span class="tabular" style="color:var(--meta-text-strong)">${total}/${coach.maxSeats} suất</span>
          <span style="color:var(--meta-text-secondary);font-size:11px">${coach.heldSeats15m ? `+${coach.heldSeats15m} giữ 15p` : 'Trần cứng 8'}</span>
        </div>
        <div class="seat-track" role="progressbar" aria-valuenow="${total}" aria-valuemin="0" aria-valuemax="8" aria-label="Suất Coach ${total} trên 8">
          <div class="seat-fill ${cls}" style="width:${pct}%"></div>
        </div>
      </div>`;
    }

    function toast(message, kind = 'success') {
      const region = document.getElementById('toast-region');
      const el = document.createElement('div');
      el.className = `toast ${kind === 'warn' ? 'warn' : kind === 'danger' ? 'danger' : ''}`;
      el.innerHTML = `<span>${esc(message)}</span><button type="button" class="btn btn-ghost btn-icon" aria-label="Đóng thông báo">${icon('close', 16)}</button>`;
      el.querySelector('button').onclick = () => el.remove();
      region.appendChild(el);
      setTimeout(() => el.remove(), 4500);
    }

        target,

        reason,
        before,
        after
      });
    }

    /* =====================================================================
       DETERMINISTIC CRISP INLINE SVG QR CODE (Zero external library needed)
       ===================================================================== */
    function renderQrSvg(seedText) {
      const size = 21;
      let hash = 2166136261;
      for (let i = 0; i < seedText.length; i += 1) {
        hash ^= seedText.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      const cells = [];
      const inFinder = (r, c) =>
        (r < 7 && c < 7) || (r < 7 && c >= size - 7) || (r >= size - 7 && c < 7);
      const finderCell = (r, c) => {
        const lr = r < 7 ? r : r - (size - 7);
        const lc = c < 7 ? c : c - (size - 7);
        const rr = (r < 7 && c >= size - 7) ? r : lr;
        const cc = (r >= size - 7 && c < 7) ? c : lc;
        if (rr === 0 || rr === 6 || cc === 0 || cc === 6) return true;
        if (rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4) return true;
        return false;
      };
      for (let r = 0; r < size; r += 1) {
        for (let c = 0; c < size; c += 1) {
          let on = false;
          if (inFinder(r, c)) {
            on = finderCell(r, c);
          } else {
            hash = Math.imul(hash ^ (r * 31 + c * 17), 16777619);
            on = ((hash >>> 0) % 10) < 5;
          }
          if (on) cells.push(`<rect x="${c + 2}" y="${r + 2}" width="1" height="1" fill="#0F1115"/>`);
        }
      }
      return `<svg viewBox="0 0 ${size + 4} ${size + 4}" width="196" height="196" role="img" aria-label="Mã QR điểm danh ${esc(seedText)}">
        <rect width="${size + 4}" height="${size + 4}" fill="#FFFFFF"/>
        ${cells.join('')}
      </svg>`;
    }

        expired: `<div class="banner banner-warn" role="status"><div class="banner-body"><span class="banner-icon">${icon('alert', 18)}</span><div><p class="banner-title">Phiên đăng nhập đã hết hạn</p><p class="banner-text">Vui lòng đăng nhập lại. Hệ thống sẽ đưa bạn về đúng trang trước đó: <code style="color:var(--meta-reflection)">${esc(UI.returnUrl)}</code></p></div></div></div>`,
        error401: `<div class="banner banner-danger" role="alert"><div class="banner-body"><span class="banner-icon">${icon('alert', 18)}</span><div><p class="banner-title">Sai email hoặc mật khẩu (401)</p><p class="banner-text">Kiểm tra lại thông tin tài khoản Admin. Email đã nhập được giữ nguyên.</p></div></div></div>`,

    /* =====================================================================
       SCREEN 2: DASHBOARD (ZERO legacy PENDING Coach requests!)
       ===================================================================== */
    function renderDashboard() {
      const series = STORE.revenueSeries[STORE.dashboardPeriod];
      const grossTotal = series.reduce((s, r) => s + r.gross, 0);
      const refundTotal = series.reduce((s, r) => s + r.refund, 0);
      const netTotal = grossTotal - refundTotal;
      const maxVal = Math.max(...series.map((r) => r.gross), 1);
      const waitingIncidents = STORE.incidents.filter((i) => !i.resolved).length;
      const disputedCount = STORE.terminations.filter((t) => t.status === 'DISPUTED').length;
      const safeChartIdx = Number.isInteger(UI.selectedChartIndex)
        ? Math.max(0, Math.min(UI.selectedChartIndex, series.length - 1))
        : series.length - 1;
      const activeDay = series[safeChartIdx];

      const kpis = [
        { label: 'Member hoạt động', value: '124', meta: 'Tổng 128 · 4 bị khóa', iconName: 'users', action: 'deeplink-members-active' },
        { label: 'Coach hoạt động', value: '7 / 8', meta: '1 Coach đang COACH_LOCKED', iconName: 'award', action: 'deeplink-coaches-active' },
        { label: 'Gói Gym hiệu lực', value: '98', meta: '12 gói SCHEDULED nối tiếp', iconName: 'card', action: 'deeplink-gym-active' },
        { label: 'Gói Coach hiệu lực', value: '31', meta: '6 gói QUEUED chờ kích hoạt', iconName: 'dumbbell', action: 'deeplink-coach-pkg-active' },
        { label: 'Member chờ (COACH_LOCKED)', value: String(waitingIncidents), meta: 'Đóng băng gói Coach · Gym vẫn chạy', iconName: 'alert', action: 'deeplink-incidents', tone: waitingIncidents ? 'var(--meta-warning)' : null },
        { label: 'Tranh chấp kết thúc (>72h)', value: String(disputedCount), meta: 'Cần Admin phân xử theo D5', iconName: 'link', action: 'deeplink-disputed', tone: disputedCount ? 'var(--meta-danger)' : null }
      ];

      return `<div class="stack-20">
        <!-- Period Filter -->
        <div class="filter-bar">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1">
            <span class="badge badge-info">Asia/Ho_Chi_Minh (GMT+7)</span>
            <input type="date" class="input" style="max-width:168px" aria-label="Từ ngày" value="${STORE.dashboardPeriod === '7d' ? '2026-11-15' : '2026-10-23'}" />
            <span style="color:var(--meta-text-secondary)">đến</span>
            <input type="date" class="input" style="max-width:168px" aria-label="Đến ngày" value="2026-11-21" />
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button type="button" class="state-pill" data-dash-period="7d" aria-pressed="${STORE.dashboardPeriod === '7d'}">7 ngày gần nhất</button>
            <button type="button" class="state-pill" data-dash-period="30d" aria-pressed="${STORE.dashboardPeriod === '30d'}">30 ngày gần nhất</button>
          </div>
        </div>

        <!-- Urgent Action Banner (ONLY real operational exceptions — ZERO legacy PENDING Coach requests) -->
        ${(waitingIncidents > 0 || disputedCount > 0) ? `
        <div class="banner banner-warn" role="region" aria-label="Việc cần xử lý khẩn">
          <div class="banner-body">
            <span class="banner-icon">${icon('alert', 22)}</span>
            <div>
              <p class="banner-title">Việc cần Admin xử lý ngay (${waitingIncidents + disputedCount} hồ sơ)</p>
              <p class="banner-text">
                <strong>${waitingIncidents} hội viên</strong> đang đóng băng gói Coach do sự cố <code>COACH_LOCKED</code> và
                <strong>${disputedCount} tranh chấp</strong> kết thúc sớm quá 72 giờ (<code>DISPUTED</code>).
                Hệ thống không còn hàng đợi duyệt chọn Coach cũ.
              </p>
            </div>
          </div>
          <div class="banner-actions">
            <button type="button" class="btn btn-primary btn-sm" data-action="deeplink-incidents">Xử lý sự cố Coach (${waitingIncidents})</button>
            <button type="button" class="btn btn-danger btn-sm" data-action="deeplink-disputed">Phân xử tranh chấp (${disputedCount})</button>
          </div>
        </div>` : ''}

        <!-- Financial Summary (Gross / Simulated Refunds / Net per D3) -->
        <div class="grid-3">
          <button type="button" class="kpi-card" data-action="deeplink-payments-all">
            <div class="kpi-top"><span class="kpi-label">Doanh thu gộp (Gross)</span><span class="kpi-icon">${icon('receipt', 17)}</span></div>
            <div class="kpi-val tabular">${vnd(grossTotal)}</div>
            <div class="kpi-meta"><span>Gói Gym tại quầy & App + Gói Coach</span><span class="kpi-link-hint">Xem giao dịch →</span></div>
          </button>
          <button type="button" class="kpi-card" data-action="deeplink-payments-refunds">
            <div class="kpi-top"><span class="kpi-label">Hoàn tiền mô phỏng (D3)</span><span class="kpi-icon" style="color:var(--meta-danger)">${icon('refund', 17)}</span></div>
            <div class="kpi-val tabular" style="color:var(--meta-danger)">${vnd(-refundTotal)}</div>
            <div class="kpi-meta"><span>Chỉ bút toán mô phỏng ngoại lệ Coach</span><span class="kpi-link-hint">Lọc hoàn tiền →</span></div>
          </button>
          <button type="button" class="kpi-card" data-action="deeplink-payments-all">
            <div class="kpi-top"><span class="kpi-label">Doanh thu ròng (Net)</span><span class="kpi-icon" style="color:var(--meta-success)">${icon('check', 17)}</span></div>
            <div class="kpi-val tabular" style="color:var(--meta-success)">${vnd(netTotal)}</div>
            <div class="kpi-meta"><span>Gross trừ hoàn mô phỏng & đảo D6</span><span class="kpi-link-hint">Đối soát →</span></div>
          </button>
        </div>

        <!-- Operational KPI Cards (Deep-linked) -->
        <div class="grid-3">
          ${kpis.map((k) => `<button type="button" class="kpi-card" data-action="${k.action}">
            <div class="kpi-top">
              <span class="kpi-label">${esc(k.label)}</span>
              <span class="kpi-icon" ${k.tone ? `style="color:${k.tone}"` : ''}>${icon(k.iconName, 17)}</span>
            </div>
            <div class="kpi-val tabular" ${k.tone ? `style="color:${k.tone}"` : ''}>${esc(k.value)}</div>
            <div class="kpi-meta"><span>${esc(k.meta)}</span><span class="kpi-link-hint">Mở danh sách →</span></div>
          </button>`).join('')}
        </div>

        <!-- Daily Revenue Bar Chart (Solid Graphite + Coral/Emerald) -->
        <section class="card" aria-label="Biểu đồ doanh thu theo ngày">
          <div class="card-header-row">
            <div>
              <h2 class="card-title">Doanh thu theo ngày (${STORE.dashboardPeriod === '7d' ? '15/11 – 21/11/2026' : '30 ngày gần nhất'})</h2>
              <p class="card-sub">Bấm vào từng cột ngày để đối chiếu Gross, Hoàn mô phỏng và Net (tabular VND).</p>
            </div>
            <div class="chart-legend">
              <span class="legend-item"><span class="legend-swatch" style="background:var(--meta-primary)"></span>Doanh thu gộp</span>
              <span class="legend-item"><span class="legend-swatch" style="background:var(--meta-success)"></span>Doanh thu ròng</span>
              <span class="legend-item"><span class="legend-swatch" style="background:var(--meta-danger)"></span>Hoàn mô phỏng</span>
            </div>
          </div>
          <div class="chart-area">
            ${series.map((row, idx) => {
              const gH = Math.max(8, Math.round((row.gross / maxVal) * 100));
              const nH = Math.max(8, Math.round((row.net / maxVal) * 100));
              const rH = row.refund ? Math.max(10, Math.round((row.refund / maxVal) * 100)) : 0;
              return `<button type="button" class="chart-col" data-chart-idx="${idx}" aria-pressed="${idx === safeChartIdx}" aria-label="${row.day}: Gộp ${vnd(row.gross)}, Ròng ${vnd(row.net)}">
                <span class="chart-val tabular">${Math.round(row.net / 1000000)}tr</span>
                <span class="chart-bars">
                  <span class="bar bar-gross" style="height:${gH}%" title="Gộp ${row.day}: ${vnd(row.gross)}"></span>
                  <span class="bar bar-net" style="height:${nH}%" title="Ròng ${row.day}: ${vnd(row.net)}"></span>
                  ${rH ? `<span class="bar bar-refund" style="height:${rH}%" title="Hoàn mô phỏng ${row.day}: ${vnd(row.refund)}"></span>` : ''}
                </span>
                <span class="chart-day tabular" style="${idx === safeChartIdx ? 'color:var(--meta-primary)' : ''}">${esc(row.day)}</span>
              </button>`;
            }).join('')}
          </div>
          <div class="chart-tooltip-bar tabular">
            <span><strong>Mốc đang chọn: ${esc(activeDay.day)}</strong></span>
            <span>Gộp: <strong style="color:var(--meta-text-strong)">${vnd(activeDay.gross)}</strong></span>
            <span>Hoàn mô phỏng: <strong style="color:var(--meta-danger-text)">${vnd(-activeDay.refund)}</strong></span>
            <span>Ròng: <strong style="color:var(--meta-success)">${vnd(activeDay.net)}</strong></span>
          </div>
        </section>
      </div>`;
    }

    /* =====================================================================
       SCREEN 3: ACCOUNTS (MEMBER & COACH — No UUIDs in table, Hard Cap 8)
       ===================================================================== */
    function renderAccounts() {
      const role = UI.subTabs.accounts;
      const q = UI.filters.accountsQuery.trim().toLowerCase();

      const list = (role === 'COACH' ? STORE.coaches : STORE.members).filter((item) => {
        const matchQ = !q || item.fullName.toLowerCase().includes(q) || item.email.toLowerCase().includes(q) || item.phone.includes(q);
        const matchS = st === 'ALL' || item.status === st;
        return matchQ && matchS;
      });

      const tableContent = !list.length ? renderFilterEmptyState() : (role === 'COACH'
        ? `<div class="table-card"><div class="table-wrap"><table class="data-table">
            <thead><tr>
              <th>Huấn luyện viên</th><th>Liên hệ</th><th>Suất học viên (Trần 8)</th><th>Lịch cố định</th><th>Trạng thái</th><th class="text-right">Thao tác</th>
            </tr></thead>
            <tbody>${list.map((c) => `<tr>
              <td data-label="Huấn luyện viên"><div class="person-cell"><span class="avatar avatar-coach">${esc(c.code)}</span><div><span class="person-name">${esc(c.fullName)}</span><span class="person-sub">${esc(c.specialty)}</span></div></div></td>

                ${c.status === 'ACTIVE'

          </table></div>

              <th>Hội viên</th><th>Liên hệ</th><th>Gói Gym</th><th>Coach & Quan hệ</th><th>Trạng thái</th><th class="text-right">Thao tác</th>

            <tbody>${list.map((m) => `<tr>
              <td data-label="Hội viên"><div class="person-cell"><span class="avatar">${initials(m.fullName)}</span><div><span class="person-name">${esc(m.fullName)}</span><span class="person-sub">${esc(m.sessions)}</span></div></div></td>

          };
          if (eq) Object.assign(eq, data);
          else STORE.equipment.unshift({ id: `eq-${Date.now()}`, ...data });
          closeModal();
          toast('Đã lưu thông tin thiết bị.');
          renderApp();
        };
      } else if (kind === 'edit-exercise') {
        const ex = STORE.exercises.find((x) => x.id === id);
        dialog.innerHTML = `${header(ex ? `Sửa bài tập: ${ex.name}` : 'Thêm bài tập mới (exercises)', 'Liên kết thiết bị, độ khó, hướng dẫn kỹ thuật & video')}
          <form id="modal-form"><div class="modal-body">
            <div class="grid-2">
              <div class="field"><label class="field-label" for="ex-m-name">Tên bài tập</label><input id="ex-m-name" class="input" value="${esc(ex?.name || '')}" required /></div>
              <div class="field"><label class="field-label" for="ex-m-eq">Thiết bị liên kết</label><select id="ex-m-eq" class="select">${STORE.equipment.map((e) => `<option value="${e.id}" ${ex?.equipmentId === e.id ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select></div>
            </div>
            <div class="grid-2">
              <div class="field"><label class="field-label" for="ex-m-diff">Độ khó</label><select id="ex-m-diff" class="select">${['Cơ bản', 'Trung bình', 'Nâng cao'].map((d) => `<option value="${d}" ${ex?.difficulty === d ? 'selected' : ''}>${d}</option>`).join('')}</select></div>
              <div class="field"><label class="field-label" for="ex-m-mus">Nhóm cơ</label><input id="ex-m-mus" class="input" value="${esc(ex?.muscles || '')}" required /></div>
            </div>
            <div class="field"><label class="field-label" for="ex-m-inst">Hướng dẫn kỹ thuật</label><textarea id="ex-m-inst" class="textarea" required>${esc(ex?.instructions || '')}</textarea></div>
            <div class="field"><label class="field-label" for="ex-m-safe">Lưu ý an toàn</label><input id="ex-m-safe" class="input" value="${esc(ex?.safety || '')}" required placeholder="Ví dụ: Tránh võng lưng dưới; kiểm soát nhịp hạ tạ…" /></div>
            <div class="grid-2">
              <div class="field"><label class="field-label" for="ex-m-vid">Video URL</label><input id="ex-m-vid" class="input" value="${esc(ex?.videoUrl || '')}" placeholder="https://cdn.metagym.vn/video/..." /></div>
              <div class="field"><label class="field-label" for="ex-m-st">Trạng thái</label><select id="ex-m-st" class="select"><option value="ACTIVE" ${ex?.status !== 'HIDDEN' ? 'selected' : ''}>Hiển thị</option><option value="HIDDEN" ${ex?.status === 'HIDDEN' ? 'selected' : ''}>Ẩn</option></select></div>
            </div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-ghost" data-close-modal>Hủy</button><button type="submit" class="btn btn-primary">Lưu bài tập</button></div></form>`;
        document.getElementById('modal-form').onsubmit = (ev) => {
          ev.preventDefault();
          const eqId = document.getElementById('ex-m-eq').value;
          const eqObj = STORE.equipment.find((e) => e.id === eqId);
          const data = {
            name: document.getElementById('ex-m-name').value.trim(),
            equipmentId: eqId, equipmentName: eqObj ? eqObj.name : 'Tạ tự do',
            difficulty: document.getElementById('ex-m-diff').value,
            muscles: document.getElementById('ex-m-mus').value.trim(),
            instructions: document.getElementById('ex-m-inst').value.trim(),
            safety: document.getElementById('ex-m-safe').value.trim(),
            videoUrl: document.getElementById('ex-m-vid').value.trim(),
            status: document.getElementById('ex-m-st').value
          };
          if (ex) Object.assign(ex, data);
          else STORE.exercises.unshift({ id: `ex-${Date.now()}`, ...data });
          closeModal();
          toast('Đã lưu bài tập vào thư viện exercises.');
          renderApp();
        };
      } else if (kind === 'change-password') {
        dialog.innerHTML = `${header('Hồ sơ Admin & Đổi mật khẩu', `${STORE.admin.fullName} · ${STORE.admin.email}`)}
          <form id="modal-form"><div class="modal-body">
            <div class="field"><label class="field-label" for="pw-old">Mật khẩu hiện tại</label><input id="pw-old" type="password" class="input" required /></div>
            <div class="field"><label class="field-label" for="pw-new">Mật khẩu mới (tối thiểu 8 ký tự, hoa/thường/số)</label><input id="pw-new" type="password" class="input" minlength="8" required /></div>
            <div class="field"><label class="field-label" for="pw-confirm">Nhập lại mật khẩu mới</label><input id="pw-confirm" type="password" class="input" minlength="8" required /></div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-ghost" data-close-modal>Hủy</button><button type="submit" class="btn btn-primary">${icon('key', 16)} Đổi mật khẩu & thu hồi phiên</button></div></form>`;
        document.getElementById('modal-form').onsubmit = (ev) => {
          ev.preventDefault();
          closeModal();
          UI.screen = 'login';
          UI.loginScenario = 'normal';
          toast('Đã đổi mật khẩu Admin và thu hồi phiên cũ. Vui lòng đăng nhập lại.');
          renderApp();
        };
      }

      overlay.hidden = false;
      overlay.classList.add('open');
      dialog.querySelectorAll('[data-close-modal]').forEach((b) => { b.onclick = closeModal; });
      const firstInput = dialog.querySelector('input, select, textarea, button:not([data-close-modal])');
      if (firstInput) firstInput.focus();
    }

    function wireReasonGuard() {
      const textarea = document.getElementById('m-reason');
      const count = document.getElementById('reason-count');
      const submit = document.getElementById('m-submit');
      if (!textarea || !submit) return;
      const sync = () => {
        const len = textarea.value.trim().length;
        if (count) count.textContent = `${textarea.value.length}/500`;
        submit.disabled = len < 1 || textarea.value.length > 500;
      };
      textarea.addEventListener('input', sync);
      sync();
    }

    function closeModal() {
      const overlay = document.getElementById('modal-overlay');
      overlay.classList.remove('open');
      overlay.hidden = true;
    }

    /* =====================================================================
       EVENT BINDING
       ===================================================================== */
    function bindEvents() {
      // Navigation
      document.querySelectorAll('[data-nav]').forEach((el) => {
        el.onclick = (ev) => {
          ev.preventDefault();
          UI.screen = el.dataset.nav;
          UI.sidebarOpen = false;
          renderApp();
        };
      });

      // Sub-tabs
      document.querySelectorAll('[data-subtab]').forEach((el) => {
        el.onclick = () => {
          const [key, val] = el.dataset.subtab.split(':');
          UI.subTabs[key] = val;
          renderApp();
        };
      });

      // Mobile sidebar open/close
      const openBtn = document.getElementById('menu-open-btn');
      const closeBtn = document.getElementById('sidebar-close-btn');
      const backdrop = document.getElementById('sidebar-backdrop');
      if (openBtn) openBtn.onclick = () => { UI.sidebarOpen = true; renderApp(); };
      if (closeBtn) closeBtn.onclick = () => { UI.sidebarOpen = false; renderApp(); };
      if (backdrop) backdrop.onclick = () => { UI.sidebarOpen = false; renderApp(); };

      // Login screen interactions
      document.querySelectorAll('[data-login-scenario]').forEach((btn) => {
        btn.onclick = () => { UI.loginScenario = btn.dataset.loginScenario; renderApp(); };
      });
      const loginForm = document.getElementById('login-form');
      if (loginForm) {
        loginForm.onsubmit = (ev) => {
          ev.preventDefault();
          UI.screen = UI.loginScenario === 'expired' ? 'coach-incidents' : 'dashboard';
          toast(UI.loginScenario === 'expired' ? 'Đã khôi phục phiên và quay lại Sự cố Coach theo returnUrl.' : 'Đăng nhập Admin thành công.');
          renderApp();
        };
      }

      // Dashboard interactions
      document.querySelectorAll('[data-dash-period]').forEach((btn) => {
        btn.onclick = () => { STORE.dashboardPeriod = btn.dataset.dashPeriod; renderApp(); };
      });
      document.querySelectorAll('[data-chart-idx]').forEach((el) => {
        el.onclick = () => { UI.selectedChartIndex = Number(el.dataset.chartIdx); renderApp(); };
      });

      // Modals & Drawers
      document.querySelectorAll('[data-modal]').forEach((btn) => {
        btn.onclick = () => openModal(btn.dataset.modal, btn.dataset.id);
      });
      document.querySelectorAll('[data-drawer]').forEach((btn) => {
        btn.onclick = () => openDrawer(btn.dataset.drawer, btn.dataset.id);
      });

      // Actions & KPI Deep Links
      document.querySelectorAll('[data-action]').forEach((btn) => {
        btn.onclick = () => {
          const act = btn.dataset.action;
          if (act === 'sign-out') { UI.screen = 'login'; UI.loginScenario = 'expired'; renderApp(); }
          else if (act === 'reset-preview-data') { UI.previewState = 'data'; renderApp(); }
          else if (act === 'retry-error') { UI.previewState = 'data'; toast('Thử lại thành công — dữ liệu nháp đã được bảo toàn!'); renderApp(); }
          else if (act === 'reset-all-filters') {
            UI.previewState = 'data';
            UI.filters.accountsQuery = ''; UI.filters.accountsStatus = 'ALL';
            UI.filters.paymentsQuery = ''; UI.filters.paymentsType = 'ALL';
            UI.filters.relQuery = ''; UI.filters.relStatus = 'ALL';
            UI.filters.foodsQuery = ''; UI.filters.foodsStatus = 'ALL';
            UI.filters.catalogQuery = ''; UI.filters.auditQuery = ''; UI.filters.auditAction = 'ALL';
            renderApp();
          }
          else if (act === 'deeplink-members-active') { UI.screen = 'accounts'; UI.subTabs.accounts = 'MEMBER'; UI.filters.accountsStatus = 'ACTIVE'; renderApp(); }
          else if (act === 'deeplink-coaches-active') { UI.screen = 'accounts'; UI.subTabs.accounts = 'COACH'; UI.filters.accountsStatus = 'ACTIVE'; renderApp(); }
          else if (act === 'deeplink-gym-active') { UI.screen = 'gym-plans'; UI.subTabs['gym-plans'] = 'entitlements'; UI.filters.gymEntStatus = 'ACTIVE'; renderApp(); }
          else if (act === 'deeplink-coach-pkg-active') { UI.screen = 'coach-packages'; UI.subTabs['coach-packages'] = 'entitlements'; UI.filters.coachEntStatus = 'ACTIVE'; renderApp(); }
          else if (act === 'deeplink-incidents') { UI.screen = 'coach-incidents'; renderApp(); }
          else if (act === 'deeplink-disputed') { UI.screen = 'relationships'; UI.subTabs.relationships = 'terminations'; renderApp(); }
          else if (act === 'deeplink-payments-all') { UI.screen = 'payments'; UI.filters.paymentsType = 'ALL'; renderApp(); }
          else if (act === 'deeplink-payments-refunds') { UI.screen = 'payments'; UI.filters.paymentsType = 'SIMULATED_REFUND'; renderApp(); }
          else if (act === 'acc-page-prev') { UI.filters.accountsPage = Math.max(1, UI.filters.accountsPage - 1); renderApp(); }
          else if (act === 'acc-page-next') { UI.filters.accountsPage = Math.min(7, UI.filters.accountsPage + 1); renderApp(); }
          else if (act === 'unlock-member') {
            const m = STORE.members.find((x) => x.id === btn.dataset.id);
            if (m) { m.status = 'ACTIVE'; if (m.relStatus === 'PAUSED_MEMBER_LOCKED') m.relStatus = 'ACTIVE'; toast(`Đã mở khóa tài khoản ${m.fullName}.`); renderApp(); }
          }
          else if (act === 'toggle-food') {
            const f = STORE.foods.find((x) => x.id === btn.dataset.id);
            if (f) { f.active = !f.active; toast(`Đã cập nhật trạng thái "${f.name}".`); renderApp(); }
          }
          else if (act === 'print-qr') { window.print(); }
        };
      });

      // Live Filter Controls
      const bindInput = (id, fn) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.oninput = (ev) => {
          const pos = ev.target.selectionStart;
          fn(ev.target.value);
          renderApp();
          const next = document.getElementById(id);
          if (next) { next.focus(); if (typeof pos === 'number') next.setSelectionRange(pos, pos); }
        };
      };
      const bindSelect = (id, fn) => {
        const el = document.getElementById(id);
        if (el) el.onchange = (ev) => { fn(ev.target.value); renderApp(); };
      };

      bindInput('draft-keep-input', (v) => { UI.draftErrorNote = v; });
      bindInput('acc-search', (v) => { UI.filters.accountsQuery = v; });
      bindSelect('acc-status', (v) => { UI.filters.accountsStatus = v; });
      bindSelect('gym-ent-status', (v) => { UI.filters.gymEntStatus = v; });
      bindSelect('coach-ent-status', (v) => { UI.filters.coachEntStatus = v; });
      bindInput('pay-search', (v) => { UI.filters.paymentsQuery = v; });
      bindSelect('pay-type', (v) => { UI.filters.paymentsType = v; });
      bindInput('rel-search', (v) => { UI.filters.relQuery = v; });
      bindSelect('rel-status', (v) => { UI.filters.relStatus = v; });
      bindInput('food-search', (v) => { UI.filters.foodsQuery = v; });
      bindSelect('food-status', (v) => { UI.filters.foodsStatus = v; });
      bindInput('cat-search', (v) => { UI.filters.catalogQuery = v; });
      bindInput('audit-search', (v) => { UI.filters.auditQuery = v; });
      bindSelect('audit-action', (v) => { UI.filters.auditAction = v; });

      // Front-Desk Searchable Member Combobox
      const fdInput = document.getElementById('fd-member-input');
      if (fdInput) {
        fdInput.onfocus = () => {
          if (!UI.frontDesk.comboOpen) { UI.frontDesk.comboOpen = true; document.getElementById('fd-combo-list')?.classList.add('open'); }
        };
        fdInput.oninput = (ev) => {
          const pos = ev.target.selectionStart;
          UI.frontDesk.memberSearch = ev.target.value;
          UI.frontDesk.comboOpen = true;
          renderApp();
          const next = document.getElementById('fd-member-input');
          if (next) { next.focus(); if (typeof pos === 'number') next.setSelectionRange(pos, pos); }
        };
      }
      document.querySelectorAll('[data-fd-pick-member]').forEach((btn) => {
        btn.onclick = () => {
          const m = STORE.members.find((x) => x.id === btn.dataset.fdPickMember);
          if (m) {
            UI.frontDesk.memberId = m.id;
            UI.frontDesk.memberSearch = m.fullName;
            UI.frontDesk.comboOpen = false;
            UI.frontDesk.idempotencyKey = `fd_${m.id}_${UI.frontDesk.planId}_${Math.random().toString(16).slice(2, 6)}`;
            renderApp();
          }
        };
      });
      const fdPlan = document.getElementById('fd-plan-select');
      if (fdPlan) {
        fdPlan.onchange = (ev) => {
          UI.frontDesk.planId = ev.target.value;
          UI.frontDesk.idempotencyKey = `fd_${UI.frontDesk.memberId}_${UI.frontDesk.planId}_${Math.random().toString(16).slice(2, 6)}`;
          renderApp();
        };
      }

      // Gym Profile Live Form
      const gymForm = document.getElementById('gym-profile-form');
      if (gymForm) {
        gymForm.onsubmit = (ev) => {
          ev.preventDefault();
          const fd = new FormData(gymForm);
          ['name', 'address', 'phone', 'email', 'openingHours', 'rules', 'description', 'coverUrl'].forEach((k) => {
            STORE.gymProfile[k] = String(fd.get(k) || '').trim();
          });
          toast('Đã lưu hồ sơ phòng gym và cập nhật bản xem trước công khai.');
          renderApp();
        };
      }
    }

    /* =====================================================================
       GLOBAL PREVIEW BAR & KEYBOARD HANDLERS
       ===================================================================== */
    document.querySelectorAll('.state-pill[data-state]').forEach((btn) => {
      btn.onclick = () => {
        UI.previewState = btn.dataset.state;
        if (UI.screen === 'login') UI.screen = 'dashboard';
        renderApp();
      };
    });

    document.getElementById('toggle-login-btn').onclick = () => {
      UI.screen = UI.screen === 'login' ? 'dashboard' : 'login';
      renderApp();
    };

    document.getElementById('quick-modal-select').onchange = (ev) => {
      const val = ev.target.value;
      if (!val) return;
      if (UI.screen === 'login') { UI.screen = 'dashboard'; renderApp(); }
      openModal(val);
      ev.target.value = '';
    };

    document.getElementById('modal-overlay').onclick = (ev) => {
      if (ev.target.id === 'modal-overlay') closeModal();
    };
    document.getElementById('drawer-overlay').onclick = (ev) => {
      if (ev.target.id === 'drawer-overlay') closeDrawer();
    };

    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') {
        closeModal();
        closeDrawer();
        if (UI.sidebarOpen) { UI.sidebarOpen = false; renderApp(); }
      }
    });

    renderApp();
  </script>
</body>
</html>
