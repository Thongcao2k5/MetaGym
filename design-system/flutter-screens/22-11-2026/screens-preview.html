<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meta Gym — Flutter Full-Data Screen Preview Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./tokens.css" />
</head>
<body>

  <!-- STUDIO CONTROL BAR -->
  <header class="studio-bar">
    <div class="studio-inner">
      <div class="studio-brand">
        <a href="../../index.html" class="ctrl-btn" style="text-decoration:none;display:inline-flex;align-items:center;">← Hub</a>
        <div class="mg-logo" style="width:34px;height:34px;font-size:12px;border-radius:10px;">MG</div>
        <div>
          <h1>Flutter Screen Preview — Bám sát code thực tế (Full Data)</h1>
          <span>Bấm trực tiếp vào nút / thẻ / thanh điều hướng trên màn hình để chạy luồng UX cho Dev</span>
        </div>
      </div>

      <div class="studio-controls">
        <button class="ctrl-btn" id="btn-proto" title="Xem 1 máy tương tác như Figma Prototype">▶ Chế độ Luồng UX</button>
        <button class="ctrl-btn" id="btn-hotspots" title="Hiện viền nét đứt các vùng bấm được">Hiện điểm bấm</button>
        <span class="ctrl-divider"></span>
        <button class="ctrl-btn active" id="btn-375">375px</button>
        <button class="ctrl-btn" id="btn-393">393px</button>
        <span class="ctrl-divider"></span>
        <button class="ctrl-btn" id="btn-theme" style="display:inline-flex;align-items:center;gap:6px;">
          <img class="ico-xs" src="../../meta-gym/assets/svg/setting/setting_theme_appearance.svg" alt="Giao diện" />
          <span id="theme-label">Chế độ Sáng</span>
        </button>
        <button class="ctrl-btn" id="btn-solid">Tắt Blur / Ảnh nền</button>
      </div>
    </div>
  </header>

  <!-- PROTOTYPE BREADCRUMB BAR (Only visible in UX Flow Prototype Mode) -->
  <div class="proto-bar" id="proto-bar">
    <div class="proto-trail" id="proto-trail"></div>
    <div style="display:flex;gap:8px;">
      <button class="ctrl-btn" id="proto-start-auth">Từ Splash</button>
      <button class="ctrl-btn" id="proto-start-member">Trang chủ HV</button>
      <button class="ctrl-btn" id="proto-start-coach">Trang chủ Coach</button>
    </div>
  </div>

  <!-- ROLE TABS -->
  <div class="role-tabs-wrap">
    <div class="role-tabs" role="tablist">
      <button class="role-tab" role="tab" data-tab="auth">Khởi động &amp; Auth <span class="tab-count" id="cnt-auth">0</span></button>
      <button class="role-tab active" role="tab" data-tab="member">Hội viên (Member) <span class="tab-count" id="cnt-member">0</span></button>
      <button class="role-tab" role="tab" data-tab="coach">Huấn luyện viên (Coach) <span class="tab-count" id="cnt-coach">0</span></button>
    </div>
  </div>

  <!-- SUB-CATEGORY FILTER BAR -->
  <div class="sub-filters-wrap" id="sub-filters"></div>

  <!-- SCREEN PANELS -->
  <main class="gallery">
    <div class="tab-panel" data-panel="auth"></div>
    <div class="tab-panel active" data-panel="member"></div>
    <div class="tab-panel" data-panel="coach"></div>
  </main>

  <div class="flow-toast" id="flow-toast"></div>

  <!-- Modular Screen Registries -->
  <script src="./screens/auth.screens.js"></script>
  <script src="./screens/member/tab1-home.js"></script>
  <script src="./screens/member/tab2-training.js"></script>
  <script src="./screens/member/tab3-ai.js"></script>
  <script src="./screens/member/tab4-messages.js"></script>
  <script src="./screens/member/tab5-profile.js"></script>
  <script src="./screens/member/tab5-profile-sub.js"></script>
  <script src="./screens/coach/core.js"></script>
  <script src="./screens/coach/detail.js"></script>

  <script>
    const registry = window.METAGYM_SCREENS || {};
    const screenMeta = new Map(); // id -> { role, group, title, shortFile }
    let activeRole = 'member';
    let activeGroup = 'all';
    let protoMode = false;
    let flowHistory = ['member-home'];

    // 1. Render all panels
    ['auth', 'member', 'coach'].forEach(role => {
      const list = registry[role] || [];
      const countEl = document.getElementById('cnt-' + role);
      if (countEl) countEl.textContent = list.length;
      const panel = document.querySelector('.tab-panel[data-panel="' + role + '"]');
      if (!panel) return;
      list.forEach(s => screenMeta.set(s.id, { role, group: s.group || 'other', title: s.title, shortFile: s.shortFile }));
      panel.innerHTML = list.map(s => `
        <section class="screen-slot" data-id="${s.id}" data-role="${role}" data-group="${s.group || 'other'}">
          <div class="slot-meta">
            <div>
              <div class="slot-title">${s.title}</div>
              <div class="slot-file" title="${s.flutterFile}">${s.shortFile}</div>
            </div>
            <span class="slot-tag ${s.tagClass || ''}">${s.tag}</span>
          </div>
          ${s.html}
        </section>
      `).join('');
    });

    // 2. Declarative UX Flow Wiring (Auto-binds interactive links across all 35 screens)
    const fallbackParent = {
      'auth-register': 'auth-login',
      'member-membership': 'member-home',
      'member-membership-empty': 'member-home',
      'member-coach-booking': 'member-home',
      'member-payments': 'member-membership',
      'member-article-detail': 'member-home',
      'member-nutrition': 'member-training-hub',
      'member-journal': 'member-training-hub',
      'member-gym-visits': 'member-training-hub',
      'member-curriculum': 'member-training-hub',
      'member-gym-equipment': 'member-training-hub',
      'member-equipment-detail': 'member-gym-equipment',
      'member-personal-info': 'member-profile',
      'member-training-profile': 'member-profile',
      'member-health-declaration': 'member-profile',
      'member-measurement': 'member-profile',
      'member-coaching': 'member-profile',
      'member-coaching-empty': 'member-profile',
      'member-coach-selection': 'member-coaching',
      'member-coach-detail': 'member-coach-selection',
      'member-coach-offers': 'member-coach-detail',
      'member-notifications': 'member-home',
      'member-security': 'member-profile',
      'member-privacy': 'member-profile',
      'member-app-settings': 'member-profile',
      'member-support': 'member-profile',
      'coach-members': 'coach-home',
      'coach-training': 'coach-home',
      'coach-nutrition': 'coach-home'
    };

    function bindTextLink(slot, selector, textContains, targetId) {
      slot.querySelectorAll(selector).forEach(el => {
        if (el.textContent && el.textContent.includes(textContains)) {
          el.setAttribute('data-go', targetId);
        }
      });
    }

    function wireAllFlows() {
      document.querySelectorAll('.screen-slot').forEach(slot => {
        const id = slot.dataset.id;
        const role = slot.dataset.role;

        // Back buttons
        slot.querySelectorAll('.circle-btn').forEach(btn => {
          if (btn.querySelector('img[src*="common_back.svg"]')) btn.setAttribute('data-back', '1');
          if (btn.querySelector('img[src*="setting_notifications_bell.svg"]')) btn.setAttribute('data-go', 'member-notifications');
          if (btn.querySelector('img[src*="workout_history.svg"]')) btn.setAttribute('data-go', 'member-gym-visits');
          if (btn.querySelector('img[src*="equip_dumbbell.svg"]')) btn.setAttribute('data-go', 'member-gym-equipment');
        });

        // Bottom Nav bars
        slot.querySelectorAll('.bottom-nav').forEach(nav => {
          const isCoach = role === 'coach';
          nav.querySelectorAll('.nav-item, .nav-ai-wrap').forEach(item => {
            const img = item.querySelector('img');
            const alt = img ? img.getAttribute('alt') : '';
            if (alt === 'Trang chủ') item.setAttribute('data-go', isCoach ? 'coach-home' : 'member-home');
            else if (alt === 'Tập luyện') item.setAttribute('data-go', 'member-training-hub');
            else if (alt === 'Lịch dạy') item.setAttribute('data-go', 'coach-sessions');
            else if (alt === 'AI') item.setAttribute('data-go', 'member-ai-messages');
            else if (alt === 'Tin nhắn') item.setAttribute('data-go', 'member-conversations');
            else if (alt === 'Hồ sơ') item.setAttribute('data-go', 'member-profile');
          });
        });

        // Date/Time picker triggers (Đồng bộ Meta Calendar từ admin-web/date-picker.js)
        if (id === 'member-personal-info') {
          slot.querySelectorAll('.input-box').forEach(box => {
            if (box.textContent.includes('14/05/1999')) box.setAttribute('data-pick-date', '1999-05-14');
          });
        } else if (id === 'member-nutrition') {
          slot.querySelectorAll('.row-between').forEach(r => {
            if (r.textContent.includes('22/11/2026')) r.setAttribute('data-pick-date', '2026-11-22');
          });
        } else if (id === 'member-gym-visits') {
          slot.querySelectorAll('.row').forEach(r => {
            if (r.textContent.includes('11/2026')) r.setAttribute('data-pick-date', '2026-11-22');
          });
        } else if (id === 'member-coach-booking') {
          bindTextLink(slot, '.btn-primary', 'Đặt buổi tập mới', '');
          slot.querySelectorAll('.btn-primary').forEach(b => {
            if (b.textContent.includes('Đặt buổi tập mới')) {
              b.removeAttribute('data-go');
              b.setAttribute('data-pick-date', '2026-11-22');
              b.setAttribute('data-pick-time', '18:00');
            }
          });
        }

        // Screen-specific real UX flows
        if (id === 'auth-splash') {
          slot.querySelector('.phone-body')?.setAttribute('data-go', 'auth-login');
        } else if (id === 'auth-login') {
          bindTextLink(slot, '.seg-tab', 'Đăng ký', 'auth-register');
          bindTextLink(slot, '.btn-primary', 'Đăng nhập', 'member-home');
        } else if (id === 'auth-register') {
          bindTextLink(slot, '.seg-tab', 'Đăng nhập', 'auth-login');
          bindTextLink(slot, '.btn-primary', 'Đăng ký', 'member-home');
        } else if (id === 'member-home') {
          bindTextLink(slot, '.quick-tile', 'Lịch tập', 'member-coach-booking');
          bindTextLink(slot, '.quick-tile', 'Giáo trình', 'member-curriculum');
          bindTextLink(slot, '.quick-tile', 'Dinh dưỡng', 'member-nutrition');
          bindTextLink(slot, '.quick-tile', 'Coach', 'member-coaching');
          bindTextLink(slot, '.metric-box', 'Gói tập', 'member-membership');
          bindTextLink(slot, '.metric-box', 'Coach cá nhân', 'member-coaching');
          bindTextLink(slot, '.card-liquid.featured', 'Hôm nay', 'member-curriculum');
          bindTextLink(slot, '.card-liquid', 'Thực đơn tăng cơ', 'member-nutrition');
          bindTextLink(slot, '.card-liquid', 'Chuỗi: 5 ngày', 'member-journal');
        } else if (id === 'member-membership') {
          bindTextLink(slot, '.sec-link', 'Giao dịch', 'member-payments');
        } else if (id === 'member-training-hub') {
          bindTextLink(slot, '.metric-box', 'Gói tập', 'member-membership');
          bindTextLink(slot, '.metric-box', 'Gói Coach', 'member-coaching');
          bindTextLink(slot, '.card-liquid', 'Giáo trình của Coach', 'member-curriculum');
          bindTextLink(slot, '.card-liquid', 'Theo dõi dinh dưỡng', 'member-nutrition');
          bindTextLink(slot, '.card-liquid', 'Nhật ký tập luyện', 'member-journal');
          bindTextLink(slot, '.card-liquid', 'Lịch sử tập luyện', 'member-gym-visits');
          bindTextLink(slot, '.card-liquid', 'Phòng gym & thiết bị', 'member-gym-equipment');
        } else if (id === 'member-curriculum') {
          bindTextLink(slot, '.btn-mini-orange', 'Nhắn Coach', 'member-conversations');
        } else if (id === 'member-gym-equipment') {
          bindTextLink(slot, '.card-liquid', 'Cable Crossover', 'member-equipment-detail');
        } else if (id === 'member-profile') {
          slot.querySelector('.card-warm-glass')?.setAttribute('data-go', 'member-personal-info');
        } else if (id === 'member-coaching') {
          bindTextLink(slot, '.btn-primary', 'Xem lịch với Coach', 'member-coach-booking');
          bindTextLink(slot, '.row-between', 'Giáo trình', 'member-curriculum');
          bindTextLink(slot, '.row-between', 'Nhắn Coach', 'member-conversations');
          bindTextLink(slot, '.row-between', 'Gói Coach', 'member-coach-offers');
        } else if (id === 'member-coach-selection') {
          bindTextLink(slot, '.card-liquid', 'Lê Hoàng Nam', 'member-coach-detail');
          bindTextLink(slot, '.card-liquid', 'Trần Minh Đức', 'member-coach-detail');
        } else if (id === 'member-coach-detail') {
          bindTextLink(slot, '.btn-primary', 'Xem các gói Coach', 'member-coach-offers');
        } else if (id === 'member-coach-offers') {
          bindTextLink(slot, '.sec-link', 'Xem / sửa', 'member-health-declaration');
          bindTextLink(slot, '.btn-primary', 'Chọn gói', 'member-payments');
        } else if (id === 'coach-home') {
          bindTextLink(slot, '.quick-tile', 'Học viên', 'coach-members');
          bindTextLink(slot, '.quick-tile', 'Giáo trình', 'coach-training');
          bindTextLink(slot, '.quick-tile', 'Dinh dưỡng', 'coach-nutrition');
          bindTextLink(slot, '.quick-tile', 'Lịch tập', 'coach-sessions');
          bindTextLink(slot, '.row-between', 'Hội viên của tôi', 'coach-members');
        }
      });
    }
    wireAllFlows();

    // 3. Navigation & Prototype Engine
    const toastEl = document.getElementById('flow-toast');
    let toastTimer;
    function showFlowToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
    }

    function renderProtoTrail() {
      const trail = document.getElementById('proto-trail');
      const slice = flowHistory.slice(-5);
      trail.innerHTML = slice.map((sid, idx) => {
        const meta = screenMeta.get(sid);
        const isLast = idx === slice.length - 1;
        return `<span class="proto-crumb ${isLast ? 'current' : ''}" data-crumb="${sid}">${meta ? meta.title : sid}</span>` + (isLast ? '' : '<span>→</span>');
      }).join('');
      trail.querySelectorAll('.proto-crumb').forEach(el => {
        el.addEventListener('click', () => navigateToScreen(el.dataset.crumb, true));
      });
    }

    // Paired Happy/Unhappy screens shown side-by-side in UX Flow Prototype Mode
    const protoPairs = {
      'member-membership': ['member-membership', 'member-membership-empty'],
      'member-membership-empty': ['member-membership', 'member-membership-empty'],
      'member-coaching': ['member-coaching', 'member-coaching-empty'],
      'member-coaching-empty': ['member-coaching', 'member-coaching-empty']
    };

    function navigateToScreen(targetId, fromHistory = false) {
      const meta = screenMeta.get(targetId);
      if (!meta) return;

      if (!fromHistory && flowHistory[flowHistory.length - 1] !== targetId) {
        flowHistory.push(targetId);
      }

      if (protoMode) {
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('proto-active'));
        document.querySelectorAll('.screen-slot').forEach(s => s.classList.remove('proto-current'));
        const idsToShow = protoPairs[targetId] || [targetId];
        idsToShow.forEach(sid => {
          const sm = screenMeta.get(sid);
          if (!sm) return;
          document.querySelector('.tab-panel[data-panel="' + sm.role + '"]')?.classList.add('proto-active');
          document.querySelector('.screen-slot[data-id="' + sid + '"]')?.classList.add('proto-current');
        });
        renderProtoTrail();
      } else {
        // Gallery mode: switch role tab, show all in that tab, scroll & pulse destination phone
        if (activeRole !== meta.role) {
          activeRole = meta.role;
          activeGroup = 'all';
          document.querySelectorAll('.role-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === activeRole));
          document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.dataset.panel === activeRole));
          renderSubFilters(activeRole);
          applyGroupFilter(activeRole);
        } else if (activeGroup !== 'all' && activeGroup !== meta.group) {
          activeGroup = 'all';
          renderSubFilters(activeRole);
          applyGroupFilter(activeRole);
        }
        const slot = document.querySelector('.screen-slot[data-id="' + targetId + '"]');
        if (slot) {
          slot.scrollIntoView({ behavior: 'smooth', block: 'center' });
          const phone = slot.querySelector('.phone');
          if (phone) {
            phone.classList.remove('flow-highlight');
            void phone.offsetWidth;
            phone.classList.add('flow-highlight');
          }
        }
      }
      showFlowToast('→ ' + meta.title + ' (' + meta.shortFile + ')');
    }

    // Global click delegation for data-go, data-back, and QR Check-in modal
    function regenerateDynamicQr(modal) {
      if (!modal) return;
      const host = modal.querySelector('[data-qr-svg-host]');
      const tokenEl = modal.querySelector('[data-qr-token]');
      const metaEl = modal.querySelector('[data-qr-meta]');
      const hex = Math.floor(0x1000 + Math.random() * 0xEFFF).toString(16).toUpperCase();
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      if (tokenEl) tokenEl.textContent = `MG-261122-${hex}`;
      if (metaEl) metaEl.textContent = `Tạo lúc ${hh}:${mm}:${ss} · Hết hạn 23:59 hôm nay (đổi mới mỗi lần tạo)`;
      if (host) {
        let cells = '';
        for (let r = 0; r < 11; r++) {
          for (let c = 0; c < 11; c++) {
            const inTL = r < 4 && c < 4;
            const inTR = r < 4 && c > 6;
            const inBL = r > 6 && c < 4;
            const inCenter = r >= 4 && r <= 6 && c >= 4 && c <= 6;
            if (inTL || inTR || inBL || inCenter) continue;
            if (Math.random() > 0.44) {
              const x = 6 + c * 10;
              const y = 6 + r * 10;
              const fill = (r === 9 && c === 9) ? '#FF5E36' : '#11151A';
              cells += `<rect x="${x}" y="${y}" width="8" height="8" rx="1.6" fill="${fill}"/>`;
            }
          }
        }
        host.innerHTML = `<svg viewBox="0 0 120 120" width="168" height="168" xmlns="http://www.w3.org/2000/svg">
          <rect width="120" height="120" fill="#FFFFFF"/>
          <rect x="6" y="6" width="30" height="30" rx="4" fill="#11151A"/><rect x="11" y="11" width="20" height="20" rx="2" fill="#FFFFFF"/><rect x="16" y="16" width="10" height="10" rx="1.5" fill="#FF5E36"/>
          <rect x="84" y="6" width="30" height="30" rx="4" fill="#11151A"/><rect x="89" y="11" width="20" height="20" rx="2" fill="#FFFFFF"/><rect x="94" y="16" width="10" height="10" rx="1.5" fill="#11151A"/>
          <rect x="6" y="84" width="30" height="30" rx="4" fill="#11151A"/><rect x="11" y="89" width="20" height="20" rx="2" fill="#FFFFFF"/><rect x="16" y="94" width="10" height="10" rx="1.5" fill="#11151A"/>
          ${cells}
          <rect x="44" y="44" width="32" height="32" rx="8" fill="#11151A"/>
          <text x="60" y="65" text-anchor="middle" fill="#FF5E36" font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="800">MG</text>
        </svg>`;
      }
    }

    let suppressClickUntil = 0;
    document.addEventListener('click', (e) => {
      if (Date.now() < suppressClickUntil) return;
      const openQr = e.target.closest('[data-open-qr]');
      if (openQr) {
        const modal = openQr.closest('.phone')?.querySelector('[data-qr-modal]');
        regenerateDynamicQr(modal);
        modal?.classList.add('open');
        return;
      }
      const regenQr = e.target.closest('[data-regen-qr]');
      if (regenQr) {
        e.stopPropagation();
        regenerateDynamicQr(regenQr.closest('[data-qr-modal]'));
        showFlowToast('Đã tạo mã QR Check-in mới duy nhất trong ngày');
        return;
      }
      const closeQr = e.target.closest('[data-close-qr]');
      if (closeQr) {
        closeQr.closest('[data-qr-modal]')?.classList.remove('open');
        return;
      }
      if (e.target.matches('[data-qr-modal]')) {
        e.target.classList.remove('open');
        return;
      }

      // Logout Confirmation Modal
      const openLogout = e.target.closest('[data-open-logout]');
      if (openLogout) {
        e.stopPropagation();
        openLogout.closest('.phone')?.querySelector('[data-logout-modal]')?.classList.add('open');
        return;
      }
      const closeLogout = e.target.closest('[data-close-logout]');
      if (closeLogout) {
        e.stopPropagation();
        closeLogout.closest('[data-logout-modal]')?.classList.remove('open');
        return;
      }
      if (e.target.matches('[data-logout-modal]')) {
        e.target.classList.remove('open');
        return;
      }
      const confirmLogout = e.target.closest('[data-confirm-logout]');
      if (confirmLogout) {
        e.stopPropagation();
        confirmLogout.closest('[data-logout-modal]')?.classList.remove('open');
        navigateToScreen('auth-login');
        showFlowToast('Đã đăng xuất tài khoản');
        return;
      }

      // Avatar Picker Modal (5.1 Hồ sơ & 5.2 Thông tin cá nhân)
      const openAvatar = e.target.closest('[data-open-avatar]');
      if (openAvatar) {
        e.stopPropagation();
        openAvatarPickerModal(openAvatar.closest('.phone'));
        return;
      }

      // Kinetic Body Metric Pickers (Chiều cao: Thước laser đứng | Cân nặng: Mặt cân vòng cung)
      const bodyPickerBtn = e.target.closest('[data-open-body-picker]');
      if (bodyPickerBtn) {
        e.stopPropagation();
        openBodyMetricPicker(bodyPickerBtn.closest('.phone'), bodyPickerBtn.dataset.openBodyPicker, bodyPickerBtn);
        return;
      }

      // Biometric Auth Modal (5.11 Bảo mật & 2. Đăng nhập)
      const bioBtn = e.target.closest('[data-open-biometric]');
      if (bioBtn) {
        e.stopPropagation();
        openBiometricModal(bioBtn.closest('.phone'), bioBtn.dataset.openBiometric || 'setup');
        return;
      }
      const bioToggle = e.target.closest('[data-biometric-toggle]');
      if (bioToggle) {
        e.stopPropagation();
        const phone = bioToggle.closest('.phone');
        if (bioToggle.classList.contains('on')) {
          bioToggle.classList.remove('on');
          const st = phone?.querySelector('[data-bio-status]');
          if (st) { st.className = 'pill pill-muted'; st.textContent = '● Chưa bật'; }

          openBiometricModal(phone, 'setup');

        return;

      const backEl = e.target.closest('[data-back]');
      if (backEl) {
        e.stopPropagation();
        const currentId = backEl.closest('.screen-slot')?.dataset.id;
        if (protoMode && flowHistory.length > 1) {
          flowHistory.pop();
          navigateToScreen(flowHistory[flowHistory.length - 1], true);
        } else if (currentId && fallbackParent[currentId]) {
          navigateToScreen(fallbackParent[currentId]);
        }
        return;
      }

      const pickEl = e.target.closest('[data-pick-date]');
      if (pickEl) {
        e.stopPropagation();
        openMetaCalendar(pickEl);
        return;
      }

      // App Settings Dark/Light Switch (5.13 Cài đặt ứng dụng)
      const themeSw = e.target.closest('[data-app-theme-switch]');
      if (themeSw) {
        e.stopPropagation();
        const opt = e.target.closest('[data-theme-opt]');
        const nextIsLight = opt ? opt.dataset.themeOpt === 'light' : !document.body.classList.contains('light-mode');
        applyStudioTheme(nextIsLight);
        showFlowToast(nextIsLight ? 'Đã chuyển sang Chế độ Sáng' : 'Đã chuyển sang Chế độ Tối');
        return;
      }

      // Accordion expand / collapse (5.1 Hồ sơ)
      const accToggle = e.target.closest('[data-accordion-toggle]');
      if (accToggle) {
        e.stopPropagation();
        accToggle.closest('.accordion-card')?.classList.toggle('is-open');
        return;
      }

      const goEl = e.target.closest('[data-go]');
      if (goEl) {
        e.stopPropagation();
        navigateToScreen(goEl.getAttribute('data-go'));
        return;
      }

      // Interactive micro-controls: choice chips (Giới tính, Trình độ, Filter...), toggles, day pills, segmented tabs
      const pill = e.target.closest('.filter-pill');
      if (pill && pill.parentElement) {
        pill.parentElement.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        return;
      }
      const toggle = e.target.closest('.toggle-pill');
      if (toggle) {
        toggle.classList.toggle('on');
        return;
      }
      const dayPill = e.target.closest('.day-pill');
      if (dayPill && dayPill.parentElement) {
        dayPill.parentElement.querySelectorAll('.day-pill').forEach(p => p.classList.remove('active'));
        dayPill.classList.add('active');
        return;
      }
      const segTab = e.target.closest('.seg-tab');
      if (segTab && segTab.parentElement) {
        segTab.parentElement.querySelectorAll('.seg-tab').forEach(t => t.classList.remove('active'));
        segTab.classList.add('active');
        const stateKey = segTab.getAttribute('data-state-btn');
        if (stateKey) {
          const body = segTab.closest('.phone-body');
          body?.querySelectorAll('[data-state-pane]').forEach(p => {
            p.style.display = p.getAttribute('data-state-pane') === stateKey ? '' : 'none';
          });
        }
        return;
      }

      // Fan-Deck Carousel (Hình quạt 4 Thẻ Hội viên: bấm thẻ hai bên hoặc bấm chấm tròn)
      const fanCard = e.target.closest('[data-fan-idx]');
      if (fanCard) {
        const deck = fanCard.closest('[data-fan-deck]');
        const idx = Number(fanCard.getAttribute('data-fan-idx'));
        if (deck) {
          if (Number(deck.getAttribute('data-active')) === idx) {
            navigateToScreen('member-membership');
          } else {
            setFanDeckActive(deck, idx);
          }
        }
        return;
      }
      const fanDot = e.target.closest('[data-fan-dot]');
      if (fanDot) {
        const deck = fanDot.closest('[data-fan-deck]');
        if (deck) setFanDeckActive(deck, Number(fanDot.getAttribute('data-fan-dot')));
      }
    });

    // 4. Sub-filters & Role Tabs
    const subFiltersEl = document.getElementById('sub-filters');
    function renderSubFilters(role) {
      const list = registry[role] || [];
      const seen = new Map();
      list.forEach(s => {
        const key = s.group || 'other';
        if (!seen.has(key)) seen.set(key, { label: s.groupLabel || key, count: 0 });
        seen.get(key).count++;
      });
      if (seen.size <= 1) {
        subFiltersEl.innerHTML = '';
        subFiltersEl.style.display = 'none';
        return;
      }
      subFiltersEl.style.display = 'flex';
      let html = `<button class="sub-chip ${activeGroup === 'all' ? 'active' : ''}" data-group="all">Tất cả (${list.length})</button>`;
      seen.forEach((info, key) => {
        html += `<button class="sub-chip ${activeGroup === key ? 'active' : ''}" data-group="${key}">${info.label} (${info.count})</button>`;
      });
      subFiltersEl.innerHTML = html;
      subFiltersEl.querySelectorAll('.sub-chip').forEach(btn => {

          activeGroup = btn.dataset.group;
          subFiltersEl.querySelectorAll('.sub-chip').forEach(b => b.classList.remove('active'));

    // 5b. Fan-Deck Carousel Controller (Hình quạt 4 thẻ Đồng · Bạc · Vàng · Kim Cương)
    function setFanDeckActive(deck, activeIdx) {
      const cards = Array.from(deck.querySelectorAll('[data-fan-idx]'));
      const total = cards.length;
      const norm = ((activeIdx % total) + total) % total;
      deck.setAttribute('data-active', String(norm));
      cards.forEach((card, i) => {
        let diff = (i - norm + total) % total;
        if (diff === total - 1) diff = -1;
        else if (diff > 1) diff = 2;
        card.setAttribute('data-pos', String(diff));
      });
      const current = cards[norm];
      if (current) {
        const b = deck.querySelector('[data-fan-badge]');
        const t = deck.querySelector('[data-fan-title]');
        const p = deck.querySelector('[data-fan-price]');
        const s = deck.querySelector('[data-fan-sub]');
        if (b) b.textContent = current.dataset.badge || '';
        if (t) t.textContent = current.dataset.title || '';
        if (p) p.textContent = current.dataset.price || '';
        if (s) s.textContent = current.dataset.sub || '';
      }
      deck.querySelectorAll('[data-fan-dot]').forEach(dot => {
        dot.classList.toggle('active', Number(dot.dataset.fanDot) === norm);
      });
    }

    document.addEventListener('mousedown', (e) => {
      const st = e.target.closest('.fan-stage');
      if (st) { fanSwipeDeck = st.closest('[data-fan-deck]'); fanSwipeX = e.clientX; }
    });
    document.addEventListener('mouseup', (e) => {
      if (!fanSwipeDeck) return;
      const dx = e.clientX - fanSwipeX;
      if (Math.abs(dx) > 36) {
        const cur = Number(fanSwipeDeck.getAttribute('data-active') || 0);
        setFanDeckActive(fanSwipeDeck, dx < 0 ? cur + 1 : cur - 1);
        suppressClickUntil = Date.now() + 180;
      }
      fanSwipeDeck = null;
    });

    // 6. Meta Date/Time Picker Dialog (Đồng bộ thiết kế admin-web/src/components/date-picker.js)
    const CAL_WEEKDAYS = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
    const TIME_SLOTS = ['07:00', '08:30', '10:00', '15:00', '16:30', '18:00', '19:30', '20:30'];

    function openMetaCalendar(triggerEl) {
      const phone = triggerEl.closest('.phone');
      if (!phone) return;
      phone.querySelector('.meta-cal-overlay')?.remove();

      const iso = triggerEl.getAttribute('data-pick-date') || '2026-11-22';
      const withTime = triggerEl.hasAttribute('data-pick-time');
      let selectedTime = triggerEl.getAttribute('data-pick-time') || '18:00';
      const parts = iso.split('-').map(Number);
      let viewYear = parts[0] || 2026;
      let viewMonth = parts[1] || 11;
      let selectedIso = iso;
      let pickerMode = 'day'; // 'day' | 'year' | 'month'
      const todayIso = '2026-11-22';

      const overlay = document.createElement('div');
      overlay.className = 'meta-cal-overlay';

      function fmtVN(s) {
        const [y, m, d] = s.split('-');
        return `${d}/${m}/${y}`;
      }

      function render() {
        let bodyHtml = '';
        if (pickerMode === 'year') {
          let yrs = '';
          for (let y = 2026; y >= 1950; y--) {
            yrs += `<button type="button" class="meta-cal-year-btn ${y === viewYear ? 'is-selected' : ''}" data-pick-year="${y}">${y}</button>`;
          }
          bodyHtml = `<div class="txt-xs" style="margin-bottom:8px;text-align:center;">Chọn nhanh năm</div><div class="meta-cal-year-grid">${yrs}</div>`;
        } else if (pickerMode === 'month') {
          let mths = '';
          for (let m = 1; m <= 12; m++) {
            mths += `<button type="button" class="meta-cal-year-btn ${m === viewMonth ? 'is-selected' : ''}" data-pick-month="${m}">Thg ${m}</button>`;
          }
          bodyHtml = `<div class="txt-xs" style="margin-bottom:8px;text-align:center;">Chọn tháng năm ${viewYear}</div><div class="meta-cal-year-grid" style="grid-template-columns:repeat(3,1fr);">${mths}</div>`;
        } else {
          const firstDay = new Date(Date.UTC(viewYear, viewMonth - 1, 1)).getUTCDay();
          const offset = (firstDay + 6) % 7;
          const daysInMonth = new Date(Date.UTC(viewYear, viewMonth, 0)).getUTCDate();
          let cells = '';
          for (let i = 0; i < offset; i++) cells += '<span></span>';
          for (let d = 1; d <= daysInMonth; d++) {
            const cIso = `${viewYear}-${String(viewMonth).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const cls = ['meta-cal-day', cIso === todayIso ? 'is-today' : '', cIso === selectedIso ? 'is-selected' : ''].filter(Boolean).join(' ');
            cells += `<button type="button" class="${cls}" data-iso="${cIso}">${d}</button>`;
          }
          bodyHtml = `
            <div class="meta-cal-weekdays">${CAL_WEEKDAYS.map(w => `<span>${w}</span>`).join('')}</div>
            <div class="meta-cal-grid">${cells}</div>
          `;
        }

        const timeBlock = (withTime && pickerMode === 'day') ? `
          <div class="meta-cal-times">
            <div class="txt-xs" style="font-weight:700;">Chọn khung giờ (90 phút)</div>
            <div class="meta-cal-time-grid">
              ${TIME_SLOTS.map(t => `<button type="button" class="meta-cal-time ${t === selectedTime ? 'is-selected' : ''}" data-time="${t}">${t}</button>`).join('')}
            </div>
          </div>` : '';

        overlay.innerHTML = `
          <div class="meta-cal-dialog">
            <div class="meta-cal-head">
              <button type="button" class="meta-cal-nav" data-nav="-1">‹</button>
              <button type="button" class="meta-cal-title" data-toggle-year title="Bấm để chọn nhanh Năm / Tháng">
                <span>Tháng ${String(viewMonth).padStart(2, '0')}/${viewYear}</span>
                <span style="font-size:11px;color:var(--primary);">${pickerMode === 'day' ? '▾' : '▴'}</span>
              </button>
              <button type="button" class="meta-cal-nav" data-nav="1">›</button>
            </div>
            ${bodyHtml}
            ${timeBlock}
            <div class="meta-cal-foot">
              <button type="button" class="btn-secondary" data-cal-close>Đóng</button>
              <button type="button" class="btn-primary" style="height:38px;font-size:13px;" data-cal-apply>Áp dụng</button>
            </div>
          </div>
        `;

        overlay.querySelector('[data-toggle-year]').addEventListener('click', (ev) => {
          ev.stopPropagation();
          pickerMode = pickerMode === 'day' ? 'year' : 'day';
          render();
          if (pickerMode === 'year') {
            overlay.querySelector('.meta-cal-year-btn.is-selected')?.scrollIntoView({ block: 'center' });
          }
        });
        overlay.querySelectorAll('[data-pick-year]').forEach(b => b.addEventListener('click', (ev) => {
          ev.stopPropagation();
          viewYear = Number(b.dataset.pickYear);
          pickerMode = 'month';
          render();
        }));
        overlay.querySelectorAll('[data-pick-month]').forEach(b => b.addEventListener('click', (ev) => {
          ev.stopPropagation();
          viewMonth = Number(b.dataset.pickMonth);
          pickerMode = 'day';
          render();
        }));
        overlay.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', (ev) => {
          ev.stopPropagation();
          const delta = Number(b.dataset.nav);
          if (pickerMode === 'year') { viewYear += delta * 12; }
          else if (pickerMode === 'month') { viewYear += delta; }
          else {
            viewMonth += delta;
            if (viewMonth < 1) { viewMonth = 12; viewYear--; }
            if (viewMonth > 12) { viewMonth = 1; viewYear++; }
          }
          render();
        }));
        overlay.querySelectorAll('[data-iso]').forEach(b => b.addEventListener('click', (ev) => {
          ev.stopPropagation();
          selectedIso = b.dataset.iso;
          render();
        }));
        overlay.querySelectorAll('[data-time]').forEach(b => b.addEventListener('click', (ev) => {
          ev.stopPropagation();
          selectedTime = b.dataset.time;
          render();
        }));
        overlay.querySelector('[data-cal-close]').addEventListener('click', (ev) => {
          ev.stopPropagation();
          overlay.remove();
        });
        overlay.querySelector('[data-cal-apply]').addEventListener('click', (ev) => {
          ev.stopPropagation();
          triggerEl.setAttribute('data-pick-date', selectedIso);
          if (withTime) triggerEl.setAttribute('data-pick-time', selectedTime);
          const labelSpan = triggerEl.querySelector('.tnum');
          if (labelSpan) labelSpan.textContent = withTime ? `${fmtVN(selectedIso)} · ${selectedTime}` : fmtVN(selectedIso);
          showFlowToast('Đã chọn: ' + fmtVN(selectedIso) + (withTime ? ' · ' + selectedTime : ''));
          overlay.remove();
        });
      }

      overlay.addEventListener('click', (ev) => {
        if (ev.target === overlay) overlay.remove();
      });
      render();
      phone.appendChild(overlay);
    }

    // 6c. Kinetic Body Metric Pickers (Inline Height Ruler + Vertical Laser Stadiometer + Mechanical Arc Weight Dial)
    function calcBmiInfo(heightCm, weightKg) {
      const h = heightCm / 100;
      const bmi = +(weightKg / (h * h)).toFixed(1);
      let label = 'Bình thường', cls = 'pill-success', pct = 42;
      if (bmi < 18.5) { label = 'Thiếu cân'; cls = 'pill-muted'; pct = Math.max(4, (bmi / 18.5) * 24); }
      else if (bmi < 25) { label = 'Bình thường'; cls = 'pill-success'; pct = 24 + ((bmi - 18.5) / 6.5) * 36; }
      else if (bmi < 30) { label = 'Thừa cân'; cls = 'pill-orange'; pct = 60 + ((bmi - 25) / 5) * 22; }
      else { label = 'Béo phì'; cls = 'pill-orange'; pct = Math.min(96, 82 + ((bmi - 30) / 10) * 18); }
      return { bmi, label, cls, pct };
    }
    function cmToFtIn(cm) {
      const totalIn = Math.round(cm / 2.54);
      return `${Math.floor(totalIn / 12)}'${totalIn % 12}"`;
    }
    function syncPhoneBodyMetrics(phone, heightCm, weightKg) {
      if (!phone) return;
      if (heightCm != null) {
        phone.dataset.bodyHeight = String(heightCm);
        phone.querySelectorAll('[data-height-readout]').forEach(el => { el.textContent = `${heightCm} cm`; el.dataset.value = String(heightCm); });
        phone.querySelectorAll('[data-open-body-picker="height"]').forEach(el => { el.dataset.value = String(heightCm); });
        phone.querySelectorAll('[data-summary-height]').forEach(el => el.textContent = `${heightCm} cm`);
        phone.querySelectorAll('[data-field-height]').forEach(el => el.textContent = String(heightCm));
        phone.querySelectorAll('[data-height-ft]').forEach(el => el.textContent = `${cmToFtIn(heightCm)} · Chuẩn thể hình`);
        const inlineRuler = phone.querySelector('[data-inline-ruler="height"]');
        if (inlineRuler && inlineRuler._setVal) inlineRuler._setVal(heightCm);
      }
      if (weightKg != null) {
        const wStr = Number(weightKg).toFixed(1);
        phone.dataset.bodyWeight = wStr;
        phone.querySelectorAll('[data-open-body-picker="weight"]').forEach(el => { el.dataset.value = wStr; });
        phone.querySelectorAll('[data-summary-weight]').forEach(el => el.textContent = `${wStr} kg`);
        phone.querySelectorAll('[data-field-weight]').forEach(el => el.textContent = wStr);
      }
      const h = Number(phone.dataset.bodyHeight || 174);
      const w = Number(phone.dataset.bodyWeight || 72.4);
      const info = calcBmiInfo(h, w);
      phone.querySelectorAll('[data-bmi-pill]').forEach(el => {
        el.className = `pill ${info.cls} tnum`;
        el.textContent = `● BMI ${info.bmi.toFixed(1)} · ${info.label}`;
      });
    }

    // Initialize inline horizontal precision rulers on 5.3
    document.querySelectorAll('[data-inline-ruler="height"]').forEach(wrap => {
      const min = Number(wrap.dataset.min || 120);
      const max = Number(wrap.dataset.max || 220);
      let val = Number(wrap.dataset.val || 174);
      const stepPx = 8;
      const track = wrap.querySelector('.inline-ruler-track');
      let ticksHtml = '';
      for (let v = min; v <= max; v++) {
        const isMajor = v % 10 === 0;
        const isMid = !isMajor && v % 5 === 0;
        ticksHtml += `<div class="inline-ruler-tick ${isMajor ? 'major' : isMid ? 'mid' : ''}">${isMajor ? `<span class="lbl">${v}</span>` : ''}<span class="bar"></span></div>`;
      }
      track.innerHTML = ticksHtml;
      function applyVal(next, fromUser) {
        val = Math.max(min, Math.min(max, Math.round(next)));
        const offset = (val - min) * stepPx + stepPx / 2;
        track.style.transform = `translateX(${-offset}px)`;
        if (fromUser) syncPhoneBodyMetrics(wrap.closest('.phone'), val, null);
      }
      wrap._setVal = (v) => applyVal(v, false);
      applyVal(val, false);

      let dragging = false, sx = 0, startV = val;
      wrap.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        dragging = true; sx = e.clientX; startV = val;
      });
      window.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        applyVal(startV - (e.clientX - sx) / stepPx, true);
      });
      window.addEventListener('mouseup', () => { dragging = false; });
      wrap.addEventListener('wheel', (e) => {
        e.preventDefault(); e.stopPropagation();
        applyVal(val + (e.deltaY > 0 ? 1 : -1), true);
      }, { passive: false });
    });

        function updateHeightUI() {
          const idxFromTop = max - val;
          track.style.transform = `translateY(${-(idxFromTop * pxPerCm + pxPerCm / 2)}px)`;
          const ratio = (val - min) / (max - min);

        updateHeightUI();

        const rulerEl = overlay.querySelector('[data-v-ruler]');
        let dragging = false, sy = 0, sv = val;
        rulerEl.addEventListener('mousedown', (e) => { e.stopPropagation(); dragging = true; sy = e.clientY; sv = val; });
        const onMove = (e) => {
          if (!dragging) return;
          val = Math.max(min, Math.min(max, Math.round(sv + (e.clientY - sy) / pxPerCm)));
          updateHeightUI();
        };
        const onUp = () => { dragging = false; };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        rulerEl.addEventListener('wheel', (e) => {
          e.preventDefault(); e.stopPropagation();
          val = Math.max(min, Math.min(max, val + (e.deltaY < 0 ? 1 : -1)));

        }, { passive: false });

        function cleanup() { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); overlay.remove(); }
        overlay.addEventListener('click', (ev) => {
          const st = ev.target.closest('[data-h-step]');

          if (ev.target.closest('[data-bm-save]')) {
            ev.stopPropagation();
            syncPhoneBodyMetrics(phone, val, null);
            showFlowToast(`Đã cập nhật chiều cao: ${val} cm`);

      } else {
        // Weight Mechanical Arc Dial (35.0 - 150.0 kg)
        let val = Math.max(35, Math.min(150, +(Number(triggerEl?.dataset.value || curW).toFixed(1))));
        const min = 35, max = 150;
        overlay.innerHTML = `
          <div class="body-picker-sheet">

                <circle cx="160" cy="245" r="144" fill="rgba(24,27,34,0.85)" stroke="rgba(169,199,232,0.16)" stroke-width="1"/>
                <g data-dial-ticks></g>
                <polygon points="160,34 154,20 166,20" fill="#FF5E36"/>
                <line x1="160" y1="32" x2="160" y2="76" stroke="#FF5E36" stroke-width="2.5" stroke-linecap="round"/>
              </svg>
              <div style="position:absolute;left:0;right:0;bottom:18px;text-align:center;pointer-events:none;">
                <div class="tnum" style="font-size:34px;font-weight:800;letter-spacing:-0.02em;line-height:1;" data-w-val>${val.toFixed(1)} <span style="font-size:15px;color:#8E95A5;font-weight:600;">kg</span></div>
                <div class="tnum" style="font-size:11.5px;color:#9BA3B4;margin-top:4px;" data-w-lbs>${(val * 2.20462).toFixed(1)} lbs</div>
              </div>
            </div>

            <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);border-radius:12px;padding:9px 12px;margin-bottom:12px;">
              <div class="row-between" style="font-size:11.5px;">
                <span style="color:#9BA3B4;">Chỉ số BMI (Cao ${curH} cm)</span>
                <strong class="tnum" data-w-bmi-lbl style="color:#2ECC71;">23.9 · Bình thường</strong>
              </div>
              <div class="bmi-bar-track"><div class="bmi-bar-dot" data-bmi-dot style="left:45%;"></div></div>
              <div class="row-between" style="font-size:9.5px;color:#8E95A5;">
                <span>Thiếu cân</span><span>Bình thường</span><span>Thừa cân</span><span>Béo phì</span>

        `;

        const ticksG = overlay.querySelector('[data-dial-ticks]');
        function updateWeightUI() {
          const cx = 160, cy = 245, rOuter = 192;
          const degPerKg = 5.2; // crisp arc spacing
          let html = '';
          const startTick = Math.max(min * 10, Math.floor((val - 10) * 10));
          const endTick = Math.min(max * 10, Math.ceil((val + 10) * 10));
          for (let t = startTick; t <= endTick; t++) {
            const kg = t / 10;
            const angleDeg = (kg - val) * degPerKg;
            if (Math.abs(angleDeg) > 46) continue;
            const rad = (angleDeg - 90) * Math.PI / 180;
            const isMajor = t % 10 === 0;
            const isHalf = !isMajor && t % 5 === 0;
            const len = isMajor ? 24 : isHalf ? 15 : 8;
            const x1 = cx + Math.cos(rad) * rOuter;
            const y1 = cy + Math.sin(rad) * rOuter;
            const x2 = cx + Math.cos(rad) * (rOuter - len);
            const y2 = cy + Math.sin(rad) * (rOuter - len);
            const stroke = isMajor ? '#F7F9FC' : isHalf ? 'rgba(232,237,245,0.65)' : 'rgba(232,237,245,0.28)';
            html += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${stroke}" stroke-width="${isMajor ? 2 : 1.2}" stroke-linecap="round"/>`;
            if (isMajor && t % 50 === 0 || (isMajor && Math.abs(kg - val) < 4)) {
              if (t % 20 === 0) {
                const lx = cx + Math.cos(rad) * (rOuter - 36);
                const ly = cy + Math.sin(rad) * (rOuter - 36);
                html += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" fill="#9BA3B4" font-size="11" font-weight="700" font-family="Be Vietnam Pro, sans-serif">${kg.toFixed(0)}</text>`;

        updateWeightUI();

        const dialEl = overlay.querySelector('[data-w-dial]');

        overlay.addEventListener('click', (ev) => {

          if (st) { ev.stopPropagation(); val = Math.max(min, Math.min(max, +(val + Number(st.dataset.wStep)).toFixed(1))); updateWeightUI(); return; }

          if (ev.target.closest('[data-bm-save]')) {
            ev.stopPropagation();

            cleanup();
          }
        });
      }

      phone.appendChild(overlay);
    }

    // 6d. Interactive Biometric Auth Modal (Face ID / Vân tay)

          return;

          const title = overlay.querySelector('[data-bio-title]');
          const methodLbl = method === 'face' ? 'Face ID' : 'Vân tay';

    // 7. Natural Touch-like Drag-to-Scroll (Vertical .phone-body & Horizontal .filter-row)
    let dragEl = null, dragAxis = 'y', startPos = 0, startScroll = 0, didDrag = false;
    document.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      if (e.target.closest('.inline-ruler-wrap, .stadiometer-ruler, .weight-dial-stage')) return;
      const hRow = e.target.closest('.filter-row, .tier-carousel');
      if (hRow && hRow.scrollWidth > hRow.clientWidth) {
        dragEl = hRow; dragAxis = 'x'; startPos = e.clientX; startScroll = hRow.scrollLeft; didDrag = false;
        hRow.classList.add('is-dragging');
        return;
      }
      const pBody = e.target.closest('.phone-body');
      if (pBody && pBody.scrollHeight > pBody.clientHeight) {
        dragEl = pBody; dragAxis = 'y'; startPos = e.clientY; startScroll = pBody.scrollTop; didDrag = false;
        pBody.classList.add('is-dragging');
      }
    });
    document.addEventListener('mousemove', (e) => {
      if (!dragEl) return;
      const delta = (dragAxis === 'x' ? e.clientX : e.clientY) - startPos;
      if (Math.abs(delta) > 6) didDrag = true;
      if (didDrag) {
        if (dragAxis === 'x') dragEl.scrollLeft = startScroll - delta;
        else dragEl.scrollTop = startScroll - delta;
      }
    });
    document.addEventListener('mouseup', () => {
      if (!dragEl) return;
      dragEl.classList.remove('is-dragging');
      if (didDrag) suppressClickUntil = Date.now() + 180;
      dragEl = null;
    });
    document.addEventListener('wheel', (e) => {
      const hRow = e.target.closest('.filter-row, .tier-carousel');
      if (hRow && hRow.scrollWidth > hRow.clientWidth && Math.abs(e.deltaY) > 0) {
        e.preventDefault();
        hRow.scrollLeft += e.deltaY;
      }
    }, { passive: false });
  </script>
</body>
</html>
